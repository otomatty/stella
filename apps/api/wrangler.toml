name = "falcon-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# A.sugai@a-cial.com's Account
account_id = "0a0dd103e779842ba2c67cbde20574a0"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"
GOOGLE_CLIENT_ID = "774089873889-iq12o3cq3ded2iu7aa15lru5753bo5a1.apps.googleusercontent.com"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://falcon-web.pages.dev,https://*.falcon-web.pages.dev"
INVITE_REDIRECT_URL = "https://falcon-web.pages.dev"

# AI エンドポイント (chat / review-draft) のレート制限。
[[unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Cloudflare D1 — LMS データ (旧 Neon Postgres)。
[[d1_databases]]
binding = "DB"
database_name = "falcon-db"
database_id = "5c22102a-6c90-4433-b744-4f51f0f608f9"
migrations_dir = "drizzle"

# 教材アップロード (Cloudflare R2)。
[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "falcon-materials-public"
