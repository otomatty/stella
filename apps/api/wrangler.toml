name = "stella-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# saedgewell@gmail.com's Account
account_id = "175c04a4465bcc9815b21176a852f0c0"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-4-6"
GOOGLE_CLIENT_ID = "998091191276-bfug8l2cm54llkhv078brdj3ovbtdfj8.apps.googleusercontent.com"
# 本番の Web だけを書く。CORS に加えて、ログイン後に JWT を渡す戻り先 (`return_to`) の許可にも
# 使うため、localhost を入れると本番のトークンを利用者の PC の開発サーバーへ届けさせるリンクが作れる。
# ローカルの許可は `.dev.vars` の ALLOWED_ORIGINS が上書きする (`.dev.vars.example` 参照)。
ALLOWED_ORIGINS = "https://stella-web.saedgewell.workers.dev"
INVITE_REDIRECT_URL = "https://stella-web.saedgewell.workers.dev"
# ログインなしで読める教材 (GET /api/public/*。Issue #41) のテナント。未ログインでは JWT から
# テナントが決まらないので、教材を seed するテナント (ses) をここで決める。外すと公開 API は何も返さない。
PUBLIC_CONTENT_TENANT_ID = "ses"

# --- AI Gateway (Issue #204) ---
# wrangler.toml の account_id は deploy 専用 — ランタイムには渡らない。同値を vars に明示する。
CLOUDFLARE_ACCOUNT_ID = "175c04a4465bcc9815b21176a852f0c0"
# 未設定なら Anthropic 直叩き。Grok / Workers AI Unified Billing には必須。
AI_GATEWAY_ID = "stella-ai"
# CHAT_PROVIDER = "grok"
# CHAT_MODEL = "grok-4.6"
# AI_GATEWAY_CF_API_TOKEN は secret (Workers AI Read 等の最小権限。deploy 用 CLOUDFLARE_API_TOKEN と別)。
#   wrangler secret put AI_GATEWAY_CF_API_TOKEN

# AI エンドポイント (chat / review-draft) のレート制限。
[[unsafe.bindings]]
name = "AI_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# サポート問い合わせ (公開フォーム) のレート制限 — 濫用・スパム対策。
[[unsafe.bindings]]
name = "SUPPORT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# ログインなしで読める教材 (公開の導入案内) のレート制限 — 匿名の連打対策。研修初日に
# 同じ拠点 (同じ IP) の受講者が一斉に開いても詰まらない値にしてある。
[[unsafe.bindings]]
name = "PUBLIC_CONTENT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# VS Code の接続コードの交換 (POST /api/auth/vscode-link/exchange、認証前) のレート制限 —
# 交換に通ったコードはそのまま JWT になるので、総当たりで有効なコードを探させない。拡張は
# 「VS Code で開く」のたびに交換するので、同じ拠点 (同じ IP) の受講者が一斉に開いても詰まらない値にする。
[[unsafe.bindings]]
name = "AUTH_LINK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

# Cloudflare D1 — LMS データ (旧 Neon Postgres)。
[[d1_databases]]
binding = "DB"
database_name = "stella-db"
# ローカル専用 ID。本番は deploy:prepare が stella-db の実 ID に置換する。
# 旧 DB の ID を流用しない。移行手順: docs/stella-infrastructure-migration.md
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[triggers]
crons = ["*/15 * * * *"]

# 教材アップロード (Cloudflare R2)。
[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "stella-materials-public"

# スキルシート原本 (Issue #203)。
[[r2_buckets]]
binding = "SKILL_SHEETS_BUCKET"
bucket_name = "stella-skill-sheets"

# 提出コードは公開教材バケットに置かない。
[[r2_buckets]]
binding = "SUBMISSIONS_BUCKET"
bucket_name = "stella-submissions"
