# Worker + Static Assets (SPA)。Deploy with `wrangler deploy` (not Pages)。
#
# 本番は Cloudflare Access がこのホスト名を守る。画面は API を同じオリジンの `/api/*` で呼び、
# Worker (worker/index.ts) がサービスバインディングで API の Worker へ中継する
# (Access の Cookie と `Cf-Access-Jwt-Assertion` をそのまま API に届けるため)。
name = "stella-web"
main = "worker/index.ts"
compatibility_date = "2024-12-01"

# API と同一アカウント。
account_id = "175c04a4465bcc9815b21176a852f0c0"

# Vite ビルド成果物を静的配信する。SPA なので 404 は index.html にフォールバック。
# `/api/*` だけは Worker を先に通す (SPA の fallback に飲まれて index.html が返らないように)。
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# API の Worker (apps/api の `stella-api`) へのサービスバインディング。
[[services]]
binding = "API"
service = "stella-api"
