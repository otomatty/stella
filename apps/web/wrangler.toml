# Worker + Static Assets (SPA)。Deploy with `wrangler deploy` (not Pages)。
#
# 受講者用の入口 (`stella-web`)。ログインは Clerk で、画面は API を同じオリジンの `/api/*` で呼び、
# Worker (worker/index.ts) がサービスバインディングで API の Worker へ中継する。
# 同じ成果物を講師・管理者用の入口 (`stella-admin`、下の [env.admin]) としても配り、そちらは
# Cloudflare Access で守る (Access の `Cf-Access-Jwt-Assertion` をそのまま API に届ける)。
name = "stella-web"
main = "worker/index.ts"
compatibility_date = "2024-12-01"

# API と同一アカウント。
account_id = "175c04a4465bcc9815b21176a852f0c0"

# Vite ビルド成果物を静的配信する。SPA なので 404 は index.html にフォールバック。
# `/api/*` だけは Worker を先に通す (SPA の fallback に飲まれて index.html が返らないように)。
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 受講者用の入口は Access の後ろに無いので、利用者が付けた Access のヘッダを API に渡さない。
[vars]
TRUST_ACCESS_ASSERTION = "0"

# API の Worker (apps/api の `stella-api`) へのサービスバインディング。
[[services]]
binding = "API"
service = "stella-api"

# 講師・管理者用の入口 (`wrangler deploy --env admin`)。Cloudflare のダッシュボードでこの Worker の
# workers.dev に Access を有効にする (docs/clerk-auth.md)。bindings は env に引き継がれないので書き直す。
[env.admin]
name = "stella-admin"

[env.admin.vars]
TRUST_ACCESS_ASSERTION = "1"

[env.admin.assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.admin.services]]
binding = "API"
service = "stella-api"
