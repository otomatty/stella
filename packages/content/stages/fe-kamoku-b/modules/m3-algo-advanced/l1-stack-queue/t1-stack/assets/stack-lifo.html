<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スタックのプッシュとポップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 48 1200 508" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 上だけが開いた入れ物。1→2→3の順にプッシュした状態。焦点はいちばん上の3(accent) -->
  <path d="M480 160 L480 448 L720 448 L720 160" fill="none" stroke="#B7B7BE" stroke-width="2.5"/>

  <line x1="552" y1="80" x2="552" y2="168" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="536" y="116" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">プッシュ(入れる)</text>

  <line x1="648" y1="176" x2="648" y2="80" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664" y="116" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ポップ(取り出す)</text>

  <rect x="504" y="184" width="192" height="72" rx="8" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>

  <rect x="504" y="272" width="192" height="72" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="600" y="316" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">2</text>

  <rect x="504" y="360" width="192" height="72" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="600" y="404" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>

  <text x="600" y="508" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">最後に入れた 3 が、最初に取り出される</text>
</svg>
</body>
</html>
