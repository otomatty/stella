<!doctype html>

  <rect x="160" y="160" width="880" height="440" rx="12"

  <text x="256" y="496" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">データとアクセス権は、どのサービスでも常にこちら側</text>
