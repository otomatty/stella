<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>固定費と変動費の違い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">

  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="232" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">オンプレミス</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="232" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">クラウド</text>

  <text x="352" y="352" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">始めるとき</text>
  <rect x="384" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">機器の購入費</text>
  <rect x="768" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">先行投資なし</text>

  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">毎月の費用</text>
  <rect x="384" y="416" width="352" height="104" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="456" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">使わなくても一定</text>
  <text x="560" y="492" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">固定費</text>
  <rect x="768" y="416" width="352" height="104" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="944" y="456" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">使った分だけ</text>
  <text x="944" y="492" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">変動費</text>
</svg>
</body>
</html>
