<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アクセス権の3つの関所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 28 1200 448" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 3つの関所。焦点は特定の層ではなく「全部を通ること」なので accent は使わない -->
  <rect x="280" y="96" width="800" height="288" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <line x1="280" y1="192" x2="1080" y2="192" stroke="#DDDDE2" stroke-width="1.5"/>
  <line x1="280" y1="288" x2="1080" y2="288" stroke="#DDDDE2" stroke-width="1.5"/>

  <text x="320" y="148" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">01</text>
  <text x="368" y="152" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">オブジェクト</text>
  <text x="1048" y="152" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">その箱を扱えるか</text>

  <text x="320" y="244" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">02</text>
  <text x="368" y="248" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">項目</text>
  <text x="1048" y="248" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">その列が見えるか</text>

  <text x="320" y="340" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">03</text>
  <text x="368" y="344" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">レコード</text>
  <text x="1048" y="344" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">その1件が見えるか</text>

  <line x1="232" y1="100" x2="232" y2="380" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="76" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">上から順に</text>
  <text x="232" y="416" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">全部通れば見える</text>
</svg>
</body>
</html>
