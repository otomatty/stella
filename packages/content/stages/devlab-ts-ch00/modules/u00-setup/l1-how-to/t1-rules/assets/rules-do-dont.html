<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>課題に取り組むときに守ること</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="112" y="112" width="472" height="80" rx="12"/>
    <rect x="616" y="112" width="472" height="80" rx="12"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="112" y="212" width="472" height="88" rx="12"/>
    <rect x="616" y="212" width="472" height="88" rx="12"/>
    <rect x="112" y="320" width="472" height="88" rx="12"/>
    <rect x="616" y="320" width="472" height="88" rx="12"/>
  </g>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <text x="348" y="160" fill="#16A34A">してよいこと</text>
    <text x="852" y="160" fill="#E5342B">してはいけないこと</text>
    <g fill="#0E0E10">
      <text x="348" y="264">分からないところの説明を聞く</text>
      <text x="852" y="264">生成 AI にコードを書かせる</text>
      <text x="348" y="372">AI の自動補完を切る</text>
      <text x="852" y="372"><tspan font-family="'Geist Mono', monospace" font-weight="500">tests/</tspan> と設定ファイルを書き換える</text>
    </g>
  </g>
</svg>
</body>
</html>
