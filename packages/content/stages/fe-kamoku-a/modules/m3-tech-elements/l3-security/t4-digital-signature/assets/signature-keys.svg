  <rect x="384" y="416" width="352" height="88" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="472" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">自分の秘密鍵</text>
  <rect x="768" y="416" width="352" height="88" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
