  <text x="560" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">相手の公開鍵</text>
  <rect x="768" y="296" width="352" height="88" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">自分の秘密鍵</text>

  <text x="352" y="464" text-anchor="end" font-size="24" font-weight="600"
