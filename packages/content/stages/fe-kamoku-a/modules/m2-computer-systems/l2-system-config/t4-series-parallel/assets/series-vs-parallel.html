<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>直列構成と並列構成の稼働率</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 60 1200 364" width="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- 左列: 直列構成 -->
  <text x="392" y="112" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">直列構成</text>

  <line x1="176" y1="208" x2="232" y2="208" stroke="#5C5C66" stroke-width="2"/>
  <line x1="368" y1="208" x2="424" y2="208" stroke="#5C5C66" stroke-width="2"/>
  <line x1="560" y1="208" x2="616" y2="208" stroke="#5C5C66" stroke-width="2"/>

  <rect x="232" y="176" width="136" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="300" y="216" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">装置 0.9</text>

  <rect x="424" y="176" width="136" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="492" y="216" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">装置 0.9</text>

  <text x="392" y="328" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">0.9 × 0.9 = 0.81</text>
  <text x="392" y="376" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">全部動いて、初めて動く</text>

  <!-- 右列: 並列構成 -->
  <text x="808" y="112" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">並列構成</text>

  <line x1="648" y1="208" x2="704" y2="208" stroke="#5C5C66" stroke-width="2"/>
  <line x1="704" y1="160" x2="704" y2="256" stroke="#5C5C66" stroke-width="2"/>
  <line x1="704" y1="160" x2="720" y2="160" stroke="#5C5C66" stroke-width="2"/>
  <line x1="704" y1="256" x2="720" y2="256" stroke="#5C5C66" stroke-width="2"/>
  <line x1="856" y1="160" x2="872" y2="160" stroke="#5C5C66" stroke-width="2"/>
  <line x1="856" y1="256" x2="872" y2="256" stroke="#5C5C66" stroke-width="2"/>
  <line x1="872" y1="160" x2="872" y2="256" stroke="#5C5C66" stroke-width="2"/>
  <line x1="872" y1="208" x2="928" y2="208" stroke="#5C5C66" stroke-width="2"/>

  <rect x="720" y="128" width="136" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="788" y="168" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">装置 0.9</text>

  <rect x="720" y="224" width="136" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="788" y="264" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">装置 0.9</text>

  <text x="808" y="328" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">1 - 0.1 × 0.1 = <tspan fill="#E62F9A">0.99</tspan></text>
  <text x="808" y="376" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1台でも動けば、動く</text>
</svg>
</body>
</html>
