<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 68 1200 436" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 左列: RAID 0(ストライピング) -->
  <text x="392" y="120" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">RAID 0</text>
  <text x="392" y="152" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ストライピング</text>

  <path d="M392 248 L392 272 L312 272 L312 316" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M392 248 L392 272 L472 272 L472 316" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="292" y="184" width="200" height="64" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="392" y="224" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">データ A・B</text>

  <rect x="240" y="320" width="144" height="88" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="312" y="348" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">ディスク1</text>
  <text x="312" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">A</text>

  <rect x="400" y="320" width="144" height="88" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="472" y="348" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">ディスク2</text>
  <text x="472" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">B</text>

  <text x="392" y="456" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">分けて2台に書く → 速度が高まる</text>

  <!-- 右列: RAID 1(ミラーリング) -->
  <text x="808" y="120" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">RAID 1</text>
  <text x="808" y="152" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ミラーリング</text>

  <path d="M808 248 L808 272 L728 272 L728 316" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M808 248 L808 272 L888 272 L888 316" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="708" y="184" width="200" height="64" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="808" y="224" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">データ A・B</text>

  <rect x="656" y="320" width="144" height="88" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="728" y="348" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">ディスク1</text>
  <text x="728" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">A B</text>

  <rect x="816" y="320" width="144" height="88" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="888" y="348" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">ディスク2</text>
  <text x="888" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">A B</text>

  <text x="808" y="456" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">同じものを2台に書く → 耐障害性が高まる</text>
</svg>