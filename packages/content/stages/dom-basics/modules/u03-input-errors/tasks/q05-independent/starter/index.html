<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>イベントの参加申込フォーム</title>
  </head>
  <body>
    <main id="exercise">
      <h1>イベントの参加申込フォーム</h1>
      <form id="event-signup" novalidate>
        <label for="people">人数</label>
        <input type="number" id="people" aria-describedby="people-error" />
        <p id="people-error"></p>

        <label for="date">参加日</label>
        <input type="date" id="date" aria-describedby="date-error" />
        <p id="date-error"></p>

        <label for="contact">連絡先</label>
        <input type="text" id="contact" aria-describedby="contact-error" />
        <p id="contact-error"></p>

        <button type="submit">申し込む</button>
      </form>
      <output aria-label="申込結果"></output>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
