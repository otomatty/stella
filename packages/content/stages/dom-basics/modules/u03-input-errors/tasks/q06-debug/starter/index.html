<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>備品貸出フォームの不具合を直す</title>
  </head>
  <body>
    <main id="exercise">
      <h1>備品貸出フォームの不具合を直す</h1>
      <form id="equipment" novalidate>
        <label for="item">備品名</label>
        <input type="text" id="item" aria-describedby="item-error" />
        <p id="item-error"></p>

        <label for="people">人数</label>
        <input type="number" id="people" aria-describedby="people-error" />
        <p id="people-error"></p>

        <button type="submit">貸出を申し込む</button>
      </form>
      <output aria-label="貸出結果"></output>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
