<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>練習室の利用申込</title>
  </head>
  <body>
    <main id="exercise">
      <h1>練習室の利用申込</h1>
      <form id="rehearsal-room" novalidate>
        <label for="group">団体名</label>
        <input type="text" id="group" aria-describedby="group-error" />
        <p id="group-error"></p>

        <label for="hours">利用時間</label>
        <input type="number" id="hours" aria-describedby="hours-error" />
        <p id="hours-error"></p>

        <button type="submit">利用を申し込む</button>
      </form>
      <output aria-label="申込結果"></output>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
