<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作教室の参加費を表示する</title>
  </head>
  <body>
    <main id="exercise">
      <h1>工作教室の参加費を表示する</h1>

      <output aria-label="参加費"></output>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
