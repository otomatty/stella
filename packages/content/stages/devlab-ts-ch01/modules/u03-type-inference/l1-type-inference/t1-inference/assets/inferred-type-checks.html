<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>型を省いた店名に別の値を入れ直した結果の比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="224" y="112" width="416" height="80" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="224" y="212" width="416" height="96" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="224" y="328" width="416" height="80" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="668" y="112" width="416" height="80" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="668" y="212" width="416" height="96" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="668" y="328" width="416" height="80" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="432" y="160" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">文字列を入れ直す</text>
  <text x="432" y="268" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">shopName = &quot;駅前店&quot;;</text>
  <text x="432" y="376" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#16A34A">入れ直せる</text>
  <text x="876" y="160" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">数値を入れ直す</text>
  <text x="876" y="268" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">shopName = 100;</text>
  <text x="876" y="376" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#E5342B">型のエラー</text>
  <text x="192" y="268" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#5C5C66">書き方</text>
  <text x="192" y="376" text-anchor="end" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#5C5C66">結果</text>
</svg>
</body>
</html>
