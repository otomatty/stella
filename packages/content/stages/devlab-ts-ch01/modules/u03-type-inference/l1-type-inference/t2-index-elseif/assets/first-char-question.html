<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>注文番号の先頭の文字が何番かを考えるための図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="240" y="112" width="128" height="184" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="304" y="212" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">A</text>
  <rect x="388" y="112" width="128" height="184" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="452" y="212" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <rect x="536" y="112" width="128" height="184" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="600" y="212" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">1</text>
  <rect x="684" y="112" width="128" height="184" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="748" y="212" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">0</text>
  <rect x="832" y="112" width="128" height="184" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="896" y="212" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">2</text>
  <text x="304" y="352" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">何番？</text>
</svg>
</body>
</html>
