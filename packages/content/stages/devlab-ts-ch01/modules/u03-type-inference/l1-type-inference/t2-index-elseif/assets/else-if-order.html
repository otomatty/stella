<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>配送サイズを決める二つの条件と判定順の分岐図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 480" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>
  <path d="M552 168 H792" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M552 328 H792" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M316 224 V268" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M316 384 V428" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M80 168 L316 112 L552 168 L316 224 Z" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M80 328 L316 272 L552 328 L316 384 Z" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="804" y="128" width="316" height="80" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="804" y="288" width="316" height="80" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="172" y="432" width="288" height="80" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="316" y="164" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">if (weight &lt; 2)</text>
  <text x="316" y="188" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">重さが 2 より小さい</text>
  <text x="316" y="324" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">else if (weight &lt; 5)</text>
  <text x="316" y="348" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">重さが 5 より小さい</text>
  <text x="672" y="152" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">成り立つ</text>
  <text x="672" y="312" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">成り立つ</text>
  <text x="336" y="252" text-anchor="start" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">成り立たない</text>
  <text x="336" y="412" text-anchor="start" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">成り立たない</text>
  <text x="960" y="164" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">小</text>
  <text x="960" y="188" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">重さ 1 のとき</text>
  <text x="960" y="324" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">中</text>
  <text x="960" y="348" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">重さ 3 のとき</text>
  <text x="316" y="468" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">else <tspan font-family="'Noto Sans JP', sans-serif" font-weight="600">→ 大</tspan></text>
  <text x="316" y="492" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">重さ 8 のとき</text>
</svg>
</body>
</html>
