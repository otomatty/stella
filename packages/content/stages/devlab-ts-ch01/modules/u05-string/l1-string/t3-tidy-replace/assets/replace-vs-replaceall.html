<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>最初の置き換えとすべての置き換えの違い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="276" y="112" width="408" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="276" y="212" width="408" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="276" y="320" width="408" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="716" y="112" width="408" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="716" y="212" width="408" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="716" y="320" width="408" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="480" y="160" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">.replace("-", "")</text>
  <text x="480" y="264" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#0E0E10">最初の 1 つ</text>
  <text x="480" y="372" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#E5342B">"A1-B-2"</text>
  <text x="920" y="160" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">.replaceAll("-", "")</text>
  <text x="920" y="264" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#0E0E10">すべて</text>
  <text x="920" y="372" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#16A34A">"A1B2"</text>
  <text x="244" y="264" text-anchor="end" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#5C5C66">置き換える範囲</text>
  <text x="244" y="356" text-anchor="end" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#5C5C66">結果</text>
  <text x="244" y="388" text-anchor="end" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">"A-1-B-2"</text>
</svg>
</body>
</html>
