<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>前後の空白を取って英字を小文字にする流れ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<svg viewBox="0 0 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M272 176 H312"/>
    <path d="M456 176 H496"/>
    <path d="M680 176 H720"/>
    <path d="M968 176 H1008"/>
  </g>

  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="12" y="128" width="256" height="96" rx="12"/>
    <rect x="500" y="128" width="176" height="96" rx="12"/>
  </g>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="316" y="128" width="136" height="96" rx="8"/>
    <rect x="724" y="128" width="240" height="96" rx="8"/>
  </g>
  <rect x="1012" y="128" width="176" height="96" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace"
     fill="#0E0E10" font-size="24" font-weight="500">
    <text x="140" y="184" font-size="20">"␣␣Sales Desk␣␣"</text>
    <text x="384" y="184">.trim()</text>
    <text x="588" y="184" font-size="20">"Sales Desk"</text>
    <text x="844" y="184">.toLowerCase()</text>
    <text x="1100" y="184" font-size="20">"sales desk"</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="20">
    <text x="140" y="264">値</text>
    <text x="384" y="264">関数</text>
    <text x="588" y="264">値</text>
    <text x="844" y="264">関数</text>
    <text x="1100" y="264">値</text>
  </g>
</svg>
</body>
</html>
