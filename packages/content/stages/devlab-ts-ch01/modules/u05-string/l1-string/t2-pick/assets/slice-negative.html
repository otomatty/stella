<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>後ろから数えた位置で取り出す範囲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 88 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="136" text-anchor="start" font-family="'Noto Sans JP', sans-serif"
        font-size="20" font-weight="400" fill="#5C5C66">後ろからの位置</text>
  <text x="280" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">-5</text>
  <text x="440" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">-4</text>
  <text x="600" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">-3</text>
  <text x="760" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">-2</text>
  <text x="920" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">-1</text>
  <rect x="200" y="212" width="800" height="112" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M360 212 V324 M520 212 V324 M680 212 V324 M840 212 V324" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="280" y="276" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">R</text>
  <text x="440" y="276" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <text x="600" y="276" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">8</text>
  <text x="760" y="276" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">2</text>
  <text x="920" y="276" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">4</text>
  <rect x="520" y="212" width="480" height="112" rx="12"
        fill="none" stroke="#E62F9A" stroke-width="2"/>
  <text x="280" y="356" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">0</text>
  <text x="440" y="356" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">1</text>
  <text x="600" y="356" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">2</text>
  <text x="760" y="356" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">3</text>
  <text x="920" y="356" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">4</text>
  <text x="200" y="392" text-anchor="start" font-family="'Noto Sans JP', sans-serif"
        font-size="20" font-weight="400" fill="#5C5C66">前からの位置</text>
  <text x="760" y="136" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">slice(-3) → "824"</text>
</svg>
</body>
</html>
