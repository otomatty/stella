<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>予約番号の後ろ三文字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="200" y="112" width="800" height="184" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M360 112 V296 M520 112 V296 M680 112 V296 M840 112 V296" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="280" y="212" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">R</text>
  <text x="440" y="212" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <text x="600" y="212" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">8</text>
  <text x="760" y="212" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">2</text>
  <text x="920" y="212" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">4</text>
  <rect x="520" y="112" width="480" height="184" rx="12"
        fill="none" stroke="#E62F9A" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M760 296 V344" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="760" y="376" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#0E0E10">ここだけ使う</text>
</svg>
</body>
</html>
