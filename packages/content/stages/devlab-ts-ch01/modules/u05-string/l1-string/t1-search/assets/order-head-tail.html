<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>注文番号の先頭と末尾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="280" y="112" width="640" height="124" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M492 196 H588 M636 196 H708" fill="none" stroke="#5C5C66" stroke-width="2"/>
  <path d="M540 196 V292 M672 196 V292" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text y="180" text-anchor="start" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10"><tspan x="496">O</tspan><tspan x="520">R</tspan><tspan x="544">D</tspan><tspan x="568">-</tspan><tspan x="592">4</tspan><tspan x="616">2</tspan><tspan x="640">-</tspan><tspan x="664">J</tspan><tspan x="688">P</tspan></text>
  <rect x="492" y="292" width="96" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="624" y="292" width="96" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="540" y="348" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#0E0E10">先頭</text>
  <text x="672" y="348" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="24" font-weight="600" fill="#0E0E10">末尾</text>
</svg>
</body>
</html>
