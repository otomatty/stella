<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>最初と最後のハイフンの位置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="296" y="112" width="288" height="92" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="616" y="112" width="288" height="92" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="440" y="152" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">indexOf("-")</text>
  <text x="440" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">1</text>
  <text x="760" y="152" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">lastIndexOf("-")</text>
  <text x="760" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">3</text>
  <path d="M440 204 V256 M760 204 V256" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="200" y="256" width="800" height="96" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M360 256 V352 M520 256 V352 M680 256 V352 M840 256 V352" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="280" y="312" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">A</text>
  <text x="440" y="312" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <text x="600" y="312" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">B</text>
  <text x="760" y="312" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <text x="920" y="312" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="24" font-weight="500" fill="#0E0E10">C</text>
  <text x="280" y="388" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">0</text>
  <text x="440" y="388" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">1</text>
  <text x="600" y="388" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">2</text>
  <text x="760" y="388" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">3</text>
  <text x="920" y="388" text-anchor="middle" font-family="'Geist Mono', monospace"
        font-size="20" font-weight="400" fill="#5C5C66">4</text>
</svg>
</body>
</html>
