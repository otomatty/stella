<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>代入と比較の違い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="336" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="720" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="336" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="720" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="336" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="720" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>

  <text x="512" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">=</text>
  <text x="896" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">===</text>
  <text x="304" y="268" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">意味</text>
  <text x="304" y="376" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600"><tspan font-family="'Geist Mono', monospace" font-weight="500">if</tspan> の条件に書く</text>
  <text x="512" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">値を入れる</text>
  <text x="896" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">等しいかを調べる</text>
  <text x="512" y="376" text-anchor="middle" fill="#E5342B"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">間違い</text>
  <text x="896" y="376" text-anchor="middle" fill="#16A34A"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">正しい</text>
</svg>
</body>
</html>
