<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>const と let の入れ直し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="296" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="680" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="296" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="680" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="296" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="680" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>

  <text x="472" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">const</text>
  <text x="856" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">let</text>
  <text x="264" y="268" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">作る</text>
  <text x="264" y="360" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">入れ直す</text>
  <text x="264" y="392" text-anchor="end" fill="#5C5C66"
        font-family="'Geist Mono', monospace" font-size="20" font-weight="400">n = 2;</text>
  <text x="472" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">const n = 1;</text>
  <text x="856" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">let n = 1;</text>
  <text x="472" y="376" text-anchor="middle" fill="#E5342B"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">エラー</text>
  <text x="856" y="376" text-anchor="middle" fill="#16A34A"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">入れ直せる</text>
</svg>
</body>
</html>
