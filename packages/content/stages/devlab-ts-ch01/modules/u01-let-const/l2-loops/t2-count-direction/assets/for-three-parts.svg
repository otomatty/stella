  <text x="400" y="168" textLength="400" lengthAdjust="spacingAndGlyphs"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500"
        fill="#0E0E10">for (let i = 3; i &gt;= 1; i--)</text>

  <rect x="232" y="272" width="224" height="112" rx="12"
