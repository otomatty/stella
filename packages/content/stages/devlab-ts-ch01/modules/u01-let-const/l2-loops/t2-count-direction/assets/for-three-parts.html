<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>for の三つの部分</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="128" y="112" width="944" height="104" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>

  <!-- 下線と下の箱の中央を、各部分ごとに結ぶ -->
  <path d="M472 184 H600 M628 184 H712 M744 184 H784"
        fill="none" stroke="#5C5C66" stroke-width="2"/>
  <path d="M536 184 V240 H344 V272 M672 184 V240 H600 V272 M764 184 V240 H856 V272"
        fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="400" y="168" textLength="400" lengthAdjust="spacingAndGlyphs"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500"
        fill="#0E0E10">for (let i = 3; i &gt;= 1; i--)</text>

  <rect x="232" y="272" width="224" height="112" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="488" y="272" width="224" height="112" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="744" y="272" width="224" height="112" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="344" y="320" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">開始値</text>
  <text x="600" y="320" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">条件</text>
  <text x="856" y="320" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">更新</text>
  <text x="344" y="352" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">3 から始める</text>
  <text x="600" y="352" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">1 以上の間</text>
  <text x="856" y="352" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">1 ずつ減らす</text>
</svg>
</body>
</html>
