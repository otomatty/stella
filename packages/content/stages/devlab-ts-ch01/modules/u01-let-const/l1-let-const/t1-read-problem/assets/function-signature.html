<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>関数の形と各部分の役割</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="128" y="112" width="944" height="104" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>

  <!-- 下線はコードの文字幅に合わせる -->
  <path d="M356 184 H596 M616 184 H844 M860 184 H976"
        fill="none" stroke="#5C5C66" stroke-width="2"/>
  <path d="M432 184 V276 M676 184 V276 M944 184 V276"
        fill="none" stroke="#B7B7BE" stroke-width="2"/>

  <text x="224" y="168" textLength="752" lengthAdjust="spacingAndGlyphs"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500"
        fill="#0E0E10">function confirmedQuantity(quantity: number): number</text>

  <g fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2">
    <rect x="336" y="276" width="192" height="104" rx="12"/>
    <rect x="552" y="276" width="248" height="104" rx="12"/>
    <rect x="816" y="276" width="256" height="104" rx="12"/>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif">
    <g fill="#0E0E10" font-size="24" font-weight="600">
      <text x="432" y="336">関数の名前</text>
      <text x="676" y="320">引数 = 入口</text>
      <text x="944" y="320">戻り値の型 = 出口</text>
    </g>
    <g fill="#5C5C66" font-size="20">
      <text x="676" y="352">受け取る値と、その型</text>
      <text x="944" y="352">返す値の型</text>
    </g>
  </g>
</svg>
</body>
</html>
