<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>テストで見る値の流れ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="12" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <path d="M348 236 H432" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M768 236 H852" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="104" y="152" width="232" height="168" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="448" y="112" width="304" height="256" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="864" y="152" width="232" height="168" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>

  <g text-anchor="middle" fill="#0E0E10" font-family="'Geist Mono', monospace" font-weight="500">
    <text x="220" y="232" font-size="24">1000</text>
    <text x="600" y="204" font-size="24">addTax</text>
    <text x="980" y="232" font-size="24">1100</text>
  </g>
  <g text-anchor="middle" fill="#5C5C66" font-family="'Noto Sans JP', sans-serif" font-size="20">
    <text x="220" y="268">渡す値</text>
    <text x="980" y="268">返ってくる値</text>
  </g>
  <text x="600" y="288" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="48" font-weight="700">？</text>
</svg>
</body>
</html>
