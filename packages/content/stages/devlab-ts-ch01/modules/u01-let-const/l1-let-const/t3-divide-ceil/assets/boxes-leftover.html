<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>箱に入りきらない商品</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <text x="600" y="140" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
        font-size="20" fill="#5C5C66">25 本を 12 本ずつ</text>

  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="120" y="176" width="288" height="208" rx="12"/>
    <rect x="456" y="176" width="288" height="208" rx="12"/>
  </g>
  <path d="M120 224 H408 M456 224 H744 M264 176 V224 M600 176 V224"
        fill="none" stroke="#B7B7BE" stroke-width="2"/>

  <rect x="792" y="176" width="288" height="208" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M928 216 H944 V232 H952 V276 H920 V232 H928 Z M920 248 H952"
        fill="none" stroke="#5C5C66" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
     font-size="24" font-weight="600" fill="#0E0E10">
    <text x="264" y="324">12 本</text>
    <text x="600" y="324">12 本</text>
    <text x="936" y="324">残り 1 本</text>
  </g>
</svg>
</body>
</html>
