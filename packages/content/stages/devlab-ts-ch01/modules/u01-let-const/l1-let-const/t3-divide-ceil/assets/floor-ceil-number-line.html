<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>割った値から切り捨てと切り上げへ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 64 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 2 寄りの点と左右の矢印が読めるよう、点は区間の 1 / 4 の位置に置く -->
  <path d="M128 260 H1072" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M208 248 V272 M992 248 V272" stroke="#5C5C66" stroke-width="2"/>
  <path d="M404 204 V252 M404 268 V312" stroke="#B7B7BE" stroke-width="2"/>
  <circle cx="404" cy="260" r="8" fill="#0E0E10"/>

  <path d="M392 192 H208" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <g color="#E62F9A">
    <path d="M416 192 H980" stroke="currentColor" stroke-width="2.5"/>
    <path d="M976 184 L992 192 L976 200 Z" fill="currentColor"/>
    <text x="992" y="304" text-anchor="middle" fill="currentColor"
          font-family="'Geist Mono', monospace" font-size="32" font-weight="500">3</text>
  </g>

  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10">
    <text x="300" y="116" font-size="24" font-weight="500">Math.floor</text>
    <text x="704" y="116" font-size="24" font-weight="500">Math.ceil</text>
    <text x="208" y="304" font-size="32" font-weight="500">2</text>
    <text x="404" y="344" font-size="24" font-weight="500">2.08…</text>
    <text x="404" y="376" font-size="20" fill="#5C5C66">25 / 12</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" fill="#5C5C66">
    <text x="300" y="152">小さい側へ</text>
    <text x="704" y="152">大きい側へ</text>
  </g>
</svg>
</body>
</html>
