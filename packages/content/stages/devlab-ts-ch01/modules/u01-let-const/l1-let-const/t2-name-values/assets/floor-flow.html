<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>割り算から切り捨てまでの流れ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 104 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M360 260 H440"/>
    <path d="M680 260 H832"/>
  </g>
  <text x="756" y="224" text-anchor="middle" fill="#5C5C66"
        font-size="20" font-family="'Geist Mono', monospace">Math.floor</text>

  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="64" y="160" width="280" height="200" rx="12"/>
    <rect x="456" y="160" width="208" height="200" rx="12"/>
  </g>
  <rect x="848" y="136" width="288" height="248" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" fill="#0E0E10"
     font-family="'Geist Mono', monospace" font-size="24" font-weight="500">
    <text x="204" y="268">1980 / 100</text>
    <text x="560" y="268">19.8</text>
    <text x="992" y="268">19</text>
  </g>
</svg>
</body>
</html>
