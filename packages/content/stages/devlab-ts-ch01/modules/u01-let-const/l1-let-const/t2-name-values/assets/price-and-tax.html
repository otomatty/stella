<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>価格と税から税込の金額へ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g fill="none" stroke="#5C5C66" stroke-width="2">
    <path d="M480 172 H600 V252"/>
    <path d="M480 332 H600 V252"/>
    <path d="M600 252 H720" marker-end="url(#arrow)"/>
  </g>

  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="160" y="112" width="320" height="120" rx="12"/>
    <rect x="160" y="272" width="320" height="120" rx="12"/>
  </g>
  <rect x="720" y="164" width="320" height="176" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
     font-size="24" font-weight="600" fill="#0E0E10">
    <text x="320" y="160">価格</text>
    <text x="320" y="320">税</text>
    <text x="880" y="240">税込</text>
    <text x="320" y="200"><tspan font-family="'Geist Mono', monospace" font-weight="500">1000</tspan> 円</text>
    <text x="320" y="360" font-family="'Geist Mono', monospace" font-weight="500">10%</text>
    <text x="880" y="280">？ 円</text>
  </g>
</svg>
</body>
</html>
