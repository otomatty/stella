<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>数値から注文番号への変換</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG のスタイルは presentation attribute で記述する。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M164 240 H188"/>
    <path d="M396 240 H420"/>
    <path d="M564 240 H588"/>
    <path d="M940 240 H964"/>
  </g>

  <g fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2">
    <rect x="48" y="172" width="104" height="136" rx="12"/>
    <rect x="432" y="172" width="120" height="136" rx="12"/>
  </g>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="200" y="112" width="184" height="256" rx="8"/>
    <rect x="600" y="112" width="328" height="256" rx="8"/>
  </g>
  <rect x="976" y="172" width="176" height="136" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Geist Mono', monospace"
     fill="#0E0E10" font-size="24" font-weight="500">
    <text x="100" y="248">42</text>
    <text x="292" y="248">String()</text>
    <text x="492" y="248">"42"</text>
    <text x="764" y="248">.padStart(5, "0")</text>
    <text x="1064" y="248">"00042"</text>
  </g>
</svg>
</body>
</html>
