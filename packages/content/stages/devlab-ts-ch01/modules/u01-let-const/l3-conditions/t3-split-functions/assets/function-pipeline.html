<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>数値から注文番号への変換</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG のスタイルは presentation attribute で記述する。 -->
<svg viewBox="0 0 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 短い箱と下の補足が 400 のキャンバスの中央に収まるように置く。 -->
  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M180 176 H220"/>
    <path d="M396 176 H436"/>
    <path d="M572 176 H612"/>
    <path d="M916 176 H956"/>
  </g>

  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="64" y="128" width="104" height="96" rx="12"/>
    <rect x="448" y="128" width="112" height="96" rx="12"/>
  </g>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="232" y="128" width="152" height="96" rx="8"/>
    <rect x="624" y="128" width="280" height="96" rx="8"/>
  </g>
  <rect x="968" y="128" width="168" height="96" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="116" y="184">42</text>
    <text x="308" y="184">String()</text>
    <text x="504" y="184">"42"</text>
    <text x="764" y="184">.padStart(5, "0")</text>
    <text x="1052" y="184">"00042"</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="20">
    <text x="116" y="264">値</text>
    <text x="308" y="264">関数</text>
    <text x="504" y="264">値</text>
    <text x="764" y="264">関数</text>
    <text x="1052" y="264">値</text>
  </g>
</svg>
</body>
</html>
