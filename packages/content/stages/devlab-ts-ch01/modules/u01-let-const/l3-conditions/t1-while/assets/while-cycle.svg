<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 68 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M744 268 H872"/>
    <path d="M376 268 H244"/>
    <path d="M1004 204 V100 H560 V132"/>
  </g>

  <!-- 条件を確かめる場所と、終わりの形を分ける -->
  <path d="M560 144 L732 268 L560 392 L388 268 Z"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="884" y="216" width="240" height="104" rx="8"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <ellipse cx="156" cy="268" rx="80" ry="52"
           fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif">
    <g fill="#0E0E10" font-size="24" font-weight="600">
      <text x="560" y="260">条件 <tspan font-family="'Geist Mono', monospace" font-weight="500">rest &gt; 0</tspan></text>
      <text x="1004" y="260">中身</text>
      <text x="156" y="276">終わり</text>
    </g>
    <g fill="#5C5C66" font-size="20">
      <text x="560" y="292">先に確かめる</text>
      <text x="1004" y="292">値を変える</text>
      <text x="808" y="220">成り立つ</text>
      <text x="312" y="220">成り立たない</text>
    </g>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#5C5C66" font-size="20">
    <text x="808" y="248">true</text>
    <text x="312" y="248">false</text>
  </g>
</svg>