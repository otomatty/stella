<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>値を変える処理と表示だけの処理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG のスタイルは presentation attribute で記述する。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="248" y="112" width="384" height="80" rx="12"/>
    <rect x="664" y="112" width="384" height="80" rx="12"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="248" y="212" width="384" height="96" rx="12"/>
    <rect x="664" y="212" width="384" height="96" rx="12"/>
    <rect x="248" y="328" width="384" height="80" rx="12"/>
    <rect x="664" y="328" width="384" height="80" rx="12"/>
  </g>

  <g font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <g text-anchor="middle" fill="#0E0E10">
      <text x="440" y="160">値を変える</text>
      <text x="856" y="160">値を変えない</text>
    </g>
    <g text-anchor="end" fill="#5C5C66">
      <text x="224" y="268">中身</text>
      <text x="224" y="376">くり返し</text>
    </g>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace"
     fill="#0E0E10" font-size="24" font-weight="500">
    <text x="440" y="268">rest = rest - 1;</text>
    <text x="856" y="268">console.log(rest);</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <text x="440" y="376" fill="#16A34A">終わる</text>
    <text x="856" y="376" fill="#E5342B">終わらない</text>
  </g>
</svg>
</body>
</html>
