<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>発送のたびに減る在庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG のスタイルは presentation attribute で記述する。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M312 240 H480"/>
    <path d="M720 240 H888"/>
  </g>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="84" y="112" width="216" height="256" rx="12"/>
    <rect x="492" y="112" width="216" height="256" rx="12"/>
  </g>
  <rect x="900" y="112" width="216" height="256" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif">
    <g fill="#0E0E10" font-size="24" font-weight="600">
      <text x="192" y="248">在庫 <tspan font-family="'Geist Mono', monospace" font-weight="500">2</tspan></text>
      <text x="600" y="248">在庫 <tspan font-family="'Geist Mono', monospace" font-weight="500">1</tspan></text>
      <text x="1008" y="232">在庫 <tspan font-family="'Geist Mono', monospace" font-weight="500">0</tspan></text>
    </g>
    <g fill="#5C5C66" font-size="20">
      <text x="396" y="220">発送</text>
      <text x="804" y="220">発送</text>
      <text x="1008" y="264">ここで止まる</text>
    </g>
  </g>
</svg>
</body>
</html>
