  <circle cx="496" cy="240" r="8" fill="#0E0E10"/>
  <circle cx="600" cy="240" r="8" fill="#0E0E10"/>

  <path d="M496 120 H208" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600 360 H992" stroke="#E62F9A" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10"
