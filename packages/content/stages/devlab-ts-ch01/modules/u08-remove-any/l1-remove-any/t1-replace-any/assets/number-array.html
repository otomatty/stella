<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>数値の配列と要素の数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <rect x="112" y="112" width="168" height="60" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="196" y="152" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">number[]</text>

  <rect x="112" y="200" width="528" height="184" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M288 200 V384 M464 200 V384" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="880" y="200" width="208" height="184" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>

  <path d="M656 292 H864" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="268" text-anchor="middle" fill="#5C5C66"
        font-family="'Geist Mono', monospace" font-size="20" font-weight="400">length</text>

  <text x="200" y="300" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">120</text>
  <text x="376" y="300" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">80</text>
  <text x="552" y="300" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">300</text>
  <text x="984" y="284" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">3</text>
  <text x="984" y="316" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">要素の数</text>
</svg>
</body>
</html>
