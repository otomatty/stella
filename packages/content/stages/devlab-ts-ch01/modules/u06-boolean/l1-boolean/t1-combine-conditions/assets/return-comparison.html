<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>数値と比べた結果の違い</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="348" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="732" y="112" width="352" height="80" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>

  <rect x="348" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="732" y="212" width="352" height="96" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>

  <rect x="348" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="732" y="328" width="352" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>

  <text x="524" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">数値を返す</text>
  <text x="908" y="160" text-anchor="middle" fill="#0E0E10"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">比べた結果を返す</text>

  <text x="316" y="268" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">書き方</text>
  <text x="316" y="376" text-anchor="end" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600"><tspan font-family="'Geist Mono', monospace" font-weight="500">: boolean</tspan> の関数</text>

  <text x="524" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">return seats;</text>
  <text x="908" y="268" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">return seats &gt; 0;</text>

  <text x="524" y="376" text-anchor="middle" fill="#E5342B"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">型のエラー</text>
  <text x="908" y="376" text-anchor="middle" fill="#16A34A"
        font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">返せる</text>
</svg>
</body>
</html>
