  </defs>

  <path d="M628 156 H780" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M628 264 H780" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M628 372 H780" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="128" y="112" width="480" height="88" rx="12"
