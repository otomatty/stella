  <text x="368" y="152" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">true &amp;&amp; false</text>
  <text x="368" y="180" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">両方が <tspan font-family="'Geist Mono', monospace" font-weight="500">true</tspan> のときだけ <tspan font-family="'Geist Mono', monospace" font-weight="500">true</tspan></text>
  <text x="936" y="164" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">false</text>
  <text x="368" y="260" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">true || false</text>
  <text x="368" y="288" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">どちらかが <tspan font-family="'Geist Mono', monospace" font-weight="500">true</tspan> なら <tspan font-family="'Geist Mono', monospace" font-weight="500">true</tspan></text>
  <text x="936" y="272" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">true</text>
  <text x="368" y="368" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">!true</text>
  <text x="368" y="396" text-anchor="middle" fill="#5C5C66"
        font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400">反対にする</text>
  <text x="936" y="380" text-anchor="middle" fill="#0E0E10"
        font-family="'Geist Mono', monospace" font-size="24" font-weight="500">false</text>
