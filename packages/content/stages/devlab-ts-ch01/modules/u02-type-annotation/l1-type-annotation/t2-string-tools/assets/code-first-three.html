<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>商品コードから印刷する先頭三文字の位置の図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 92 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="128" y="132" width="952" height="168" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M244 132 V300 M364 132 V300 M484 132 V300 M604 132 V300 M720 132 V300 M840 132 V300 M960 132 V300" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="120" y="124" width="372" height="184" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="188" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">T</text>
  <text x="308" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">K</text>
  <text x="424" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">Y</text>
  <text x="544" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">-</text>
  <text x="664" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">0</text>
  <text x="784" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">0</text>
  <text x="904" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">1</text>
  <text x="1020" y="224" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10">2</text>
  <text x="304" y="356" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">印刷したい部分</text>
</svg>
</body>
</html>
