<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>配送ラベルに使う宛先と日数の受け渡しの図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>
  <path d="M448 172 H600 V252 M448 332 H600 V252" fill="none" stroke="#5C5C66" stroke-width="2"/>
  <path d="M600 252 H736" fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="144" y="112" width="304" height="120" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="144" y="272" width="304" height="120" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="752" y="164" width="304" height="176" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="296" y="164" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">宛先 <tspan font-family="'Geist Mono', 'Noto Sans JP', monospace" font-weight="500">"名古屋"</tspan></text>
  <text x="296" y="200" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">文字</text>
  <text x="296" y="324" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">日数 <tspan font-family="'Geist Mono', 'Noto Sans JP', monospace" font-weight="500">3</tspan></text>
  <text x="296" y="360" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">数</text>
  <text x="904" y="244" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">ラベル</text>
  <text x="904" y="280" text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="20" font-weight="400" fill="#5C5C66">名古屋まで3日</text>
</svg>
</body>
</html>
