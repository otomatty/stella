<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>引数と戻り値の型を書く位置を示した対応図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     SVG 部分を単体で描画できるようにする。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="108" y="112" width="984" height="104" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <!-- コードの文字幅に下線を合わせる -->
  <path d="M504 184 H676 M704 184 H880 M892 184 H1008" fill="none" stroke="#5C5C66" stroke-width="2"/>
  <path d="M580 184 V276 M776 184 V276 M980 184 V276" fill="none" stroke="#B7B7BE" stroke-width="2"/>
  <text x="172" y="168" text-anchor="start" font-family="'Geist Mono', 'Noto Sans JP', monospace" font-size="24" font-weight="500" fill="#0E0E10" textLength="836" lengthAdjust="spacingAndGlyphs">function shippingLabel(city: string, days: number): string</text>
  <rect x="488" y="276" width="184" height="104" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="684" y="276" width="184" height="104" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="880" y="276" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="580" y="324" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">引数の型</text>
  <text x="776" y="324" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">引数の型</text>
  <text x="980" y="324" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600" fill="#0E0E10">戻り値の型</text>
  <text x="580" y="356" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">名前の後ろ</text>
  <text x="776" y="356" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">名前の後ろ</text>
  <text x="980" y="356" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="400" fill="#5C5C66">かっこの後ろ</text>
</svg>
</body>
</html>
