<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="328" y="112" width="360" height="80" rx="12"/>
    <rect x="708" y="112" width="360" height="80" rx="12"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="328" y="212" width="360" height="96" rx="12"/>
    <rect x="708" y="212" width="360" height="96" rx="12"/>
    <rect x="328" y="328" width="360" height="80" rx="12"/>
    <rect x="708" y="328" width="360" height="80" rx="12"/>
  </g>

  <g text-anchor="end" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="24" font-weight="600">
    <text x="296" y="268">書き方</text>
    <text x="296" y="376">そのあとの処理</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#0E0E10" font-size="24" font-weight="600">
    <text x="508" y="160">文字列を <tspan font-family="'Geist Mono', monospace" font-weight="500">return</tspan></text>
    <text x="888" y="160">エラーを <tspan font-family="'Geist Mono', monospace" font-weight="500">throw</tspan></text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="508" y="268">return &quot;エラー&quot;;</text>
    <text x="888" y="268">throw new Error(&quot;…&quot;);</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <text x="508" y="376" fill="#E5342B">そのまま続く</text>
    <text x="888" y="376" fill="#16A34A">その場で止まる</text>
  </g>
</svg>