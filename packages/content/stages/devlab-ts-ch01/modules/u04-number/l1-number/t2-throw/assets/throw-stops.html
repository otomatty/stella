<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>予約の処理を止めるかの分岐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 72 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g fill="none" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M584 192 H744"/>
    <path d="M328 292 V368 H744"/>
  </g>
  <path d="M72 192 L328 104 L584 192 L328 280 Z"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="760" y="136" width="368" height="112" rx="8"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="760" y="320" width="368" height="96" rx="8"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#0E0E10" font-size="24" font-weight="600">
    <text x="328" y="200">人数は 0 より小さい？</text>
    <text x="944" y="376">続きの処理</text>
  </g>
  <text x="944" y="184" text-anchor="middle" font-family="'Geist Mono', monospace"
        fill="#0E0E10" font-size="24" font-weight="500">throw new Error(…)</text>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="20">
    <text x="664" y="172">はい</text>
    <text x="536" y="348">いいえ</text>
    <text x="944" y="216">その場で止まる</text>
  </g>
</svg>
</body>
</html>
