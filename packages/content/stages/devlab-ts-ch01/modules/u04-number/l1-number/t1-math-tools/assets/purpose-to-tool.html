<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>目的に合う計算の道具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 16 16" refX="16" refY="8"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#5C5C66"/>
    </marker>
  </defs>

  <g stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)">
    <path d="M508 152 H692"/>
    <path d="M508 256 H692"/>
    <path d="M508 360 H692"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="132" y="112" width="360" height="80" rx="12"/>
    <rect x="132" y="216" width="360" height="80" rx="12"/>
    <rect x="132" y="320" width="360" height="80" rx="12"/>
  </g>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="708" y="112" width="360" height="80" rx="12"/>
    <rect x="708" y="216" width="360" height="80" rx="12"/>
    <rect x="708" y="320" width="360" height="80" rx="12"/>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#0E0E10" font-size="24" font-weight="600">
    <text x="312" y="160">ゼロからの距離</text>
    <text x="312" y="264">下限を守る</text>
    <text x="312" y="368">上限を守る</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="888" y="160">Math.abs</text>
    <text x="888" y="264">Math.max</text>
    <text x="888" y="368">Math.min</text>
  </g>
</svg>
</body>
</html>
