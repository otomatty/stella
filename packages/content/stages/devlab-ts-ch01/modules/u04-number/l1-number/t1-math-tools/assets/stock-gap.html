<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>実際と予定の在庫数のずれ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <path d="M160 252 H1040" stroke="#B7B7BE" stroke-width="2"/>
  <path d="M240 244 V260 M528 244 V260 M672 244 V260 M960 244 V260"
        stroke="#B7B7BE" stroke-width="2"/>
  <path d="M384 236 V268 M816 236 V268" stroke="#5C5C66" stroke-width="2"/>
  <circle cx="384" cy="252" r="8" fill="#0E0E10"/>
  <circle cx="816" cy="252" r="8" fill="#0E0E10"/>

  <g color="#E62F9A">
    <path d="M384 196 V164 H816 V196" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="600" y="136" text-anchor="middle" font-family="'Noto Sans JP', sans-serif"
          fill="currentColor" font-size="24" font-weight="600">ずれ ？</text>
  </g>

  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="24" font-weight="600">
    <text x="384" y="312">実際</text>
    <text x="816" y="312">予定</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10" font-size="32" font-weight="500">
    <text x="384" y="356">7</text>
    <text x="816" y="356">10</text>
  </g>
</svg>
</body>
</html>
