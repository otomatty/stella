<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>上限に使う道具の比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="332" y="112" width="360" height="80" rx="12"/>
    <rect x="712" y="112" width="360" height="80" rx="12"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="332" y="212" width="360" height="96" rx="12"/>
    <rect x="712" y="212" width="360" height="96" rx="12"/>
    <rect x="332" y="328" width="360" height="80" rx="12"/>
    <rect x="712" y="328" width="360" height="80" rx="12"/>
  </g>

  <g text-anchor="end" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="24" font-weight="600">
    <text x="300" y="268">選ばれる値</text>
    <text x="300" y="376">上限 100 を守る</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="512" y="160">Math.min(120, 100)</text>
    <text x="892" y="160">Math.max(120, 100)</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="512" y="268">100</text>
    <text x="892" y="268">120</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <text x="512" y="376" fill="#16A34A">守れる</text>
    <text x="892" y="376" fill="#E5342B">守れない</text>
  </g>
</svg>
</body>
</html>
