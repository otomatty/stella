<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <g fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2">
    <rect x="312" y="112" width="360" height="80" rx="12"/>
    <rect x="692" y="112" width="360" height="80" rx="12"/>
  </g>
  <g fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5">
    <rect x="312" y="212" width="360" height="96" rx="12"/>
    <rect x="692" y="212" width="360" height="96" rx="12"/>
    <rect x="312" y="328" width="360" height="80" rx="12"/>
    <rect x="692" y="328" width="360" height="80" rx="12"/>
  </g>

  <g text-anchor="end" font-family="'Noto Sans JP', sans-serif" fill="#5C5C66" font-size="24" font-weight="600">
    <text x="280" y="268">書き方</text>
    <text x="280" y="376">NaN のとき</text>
  </g>
  <g text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#0E0E10" font-size="24" font-weight="600">
    <text x="492" y="160"><tspan font-family="'Geist Mono', monospace" font-weight="500">===</tspan> で比べる</text>
    <text x="872" y="160"><tspan font-family="'Geist Mono', monospace" font-weight="500">Number.isNaN</tspan> で調べる</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', 'Noto Sans JP', monospace" fill="#0E0E10" font-size="24" font-weight="500">
    <text x="492" y="268">value === NaN</text>
    <text x="872" y="268">Number.isNaN(value)</text>
  </g>
  <g text-anchor="middle" font-family="'Geist Mono', monospace" font-size="24" font-weight="500">
    <text x="492" y="376" fill="#E5342B">false</text>
    <text x="872" y="376" fill="#16A34A">true</text>
  </g>
</svg>