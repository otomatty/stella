<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>数値の型と有限の数と整数の範囲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<!-- SVG内のスタイルはすべて presentation attribute で書く。
     この SVG 要素だけが抽出されて単体で描画されるため、CSSクラスやvar()は効かない。 -->
<!-- 図にタイトルは入れない(タイトルはスライド側が持つ)。
     viewBoxは幅1200固定、高さと原点(minY)は本体を描き終えてから
     style-guide.md の手順で決める。 -->
<svg viewBox="0 80 1200 400" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="96" y="112" width="1008" height="304" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="2"/>
  <rect x="152" y="180" width="896" height="200" rx="12"
        fill="#F7F7F9" stroke="#5C5C66" stroke-width="2"/>
  <rect x="208" y="248" width="784" height="96" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <g fill="#0E0E10" font-family="'Noto Sans JP', sans-serif" font-size="24" font-weight="600">
    <text x="184" y="220">有限の数</text>
    <text x="240" y="288">整数</text>
  </g>
  <g fill="#0E0E10" font-family="'Geist Mono', monospace" font-size="24" font-weight="500">
    <text x="128" y="152">number</text>
    <g text-anchor="end">
      <text x="1072" y="152">NaN</text>
      <text x="956" y="152">Infinity</text>
      <text x="1016" y="220">1.5</text>
      <text x="960" y="304">12</text>
    </g>
  </g>
  <g fill="#5C5C66" font-family="'Geist Mono', monospace" font-size="20">
    <text x="304" y="220">Number.isFinite</text>
    <text x="240" y="316">Number.isInteger</text>
  </g>
</svg>
</body>
</html>
