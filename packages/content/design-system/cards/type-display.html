<!-- @dsCard group="Type" viewport="700x180" name="Display & Headings" subtitle="Heavy Japanese gothic, tight leading" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-jp); background: var(--white); color: var(--text-strong); }
  .wrap { padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .meta { font-family: var(--font-latin); font-size: 10px; color: var(--ink-400); white-space: nowrap; }
  .d { font-size: 44px; font-weight: 900; line-height: 1.05; letter-spacing: 0.01em; }
  .h2 { font-size: 32px; font-weight: 900; line-height: 1.1; }
  .h4 { font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line"><span class="d">唯一無二の遂行力</span><span class="meta">Display · 900</span></div>
    <div class="line"><span class="h2">実績・事例</span><span class="meta">H2 · 900</span></div>
    <div class="line"><span class="h4">PM型エンジニア育成</span><span class="meta">H4 · 700</span></div>
  </div>
</body>
</html>
