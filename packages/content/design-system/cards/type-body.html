<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-jp); background: var(--white); }
  .wrap { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-300); }
  .body { font-size: 16px; line-height: 1.8; letter-spacing: 0.02em; color: var(--text-body); max-width: 560px; }
  .sm { font-size: 14px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">Results &amp; Case Studies</span>
    <p class="body">競技人材をPM型エンジニアに育成し、企業の成長を支援します。スポーツで培った遂行力を、IT/DXの現場へ。</p>
    <span class="sm">Small · 14px / 補足テキスト</span>
  </div>
</body>
</html>
