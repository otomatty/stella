<!-- @dsCard group="Brand" viewport="700x150" name="Logo" subtitle="Sports Force / Tech&Boost wordmark (reference crop)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-latin); background: var(--white); }
  .wrap { padding: 22px; display: flex; gap: 22px; align-items: center; }
  .panel { flex: 1; display: flex; align-items: center; justify-content: center; height: 92px; border-radius: 12px; }
  .light { background: var(--surface-sunk); }
  .dark { background: var(--surface-ink); }
  img { height: 46px; }
  .dark img { filter: invert(1) brightness(1.4); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light"><img src="../assets/logo-sportsforce.png" alt="Sports Force Tech&Boost"></div>
    <div class="panel dark"><img src="../assets/logo-sportsforce.png" alt="Sports Force Tech&Boost on dark"></div>
  </div>
</body>
</html>
