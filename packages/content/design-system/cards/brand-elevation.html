<!-- @dsCard group="Brand" viewport="700x150" name="Elevation & Glow" subtitle="Soft neutral shadows + signature brand glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-latin); background: var(--white); }
  .wrap { padding: 26px 22px; display: flex; gap: 22px; align-items: center; }
  .card { width: 110px; height: 64px; background: #fff; border-radius: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7px; box-sizing: border-box; }
  .n { font-size: 10px; color: var(--ink-400); font-weight: 600; }
  .glow { background: var(--sf-gradient); }
  .glow .n { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" style="box-shadow:var(--shadow-sm)"><span class="n">sm</span></div>
    <div class="card" style="box-shadow:var(--shadow-md)"><span class="n">md</span></div>
    <div class="card" style="box-shadow:var(--shadow-lg)"><span class="n">lg</span></div>
    <div class="card glow" style="box-shadow:var(--glow-brand)"><span class="n">glow</span></div>
  </div>
</body>
</html>
