<!-- @dsCard group="Colors" viewport="700x150" name="Signature Gradient" subtitle="Blue → magenta → red — the brand's hero device" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-latin); background: var(--white); }
  .wrap { padding: 18px 20px; }
  .bar { height: 56px; border-radius: 12px; background: var(--sf-gradient); box-shadow: var(--glow-brand); }
  .stops { display: flex; justify-content: space-between; margin-top: 12px; }
  .stop { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .hex { font-size: 11px; font-weight: 600; color: var(--ink-500); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"></div>
    <div class="stops">
      <div class="stop"><span class="sw" style="background:#0A33FF"></span><span class="hex">#0A33FF</span></div>
      <div class="stop"><span class="sw" style="background:#8330C7"></span><span class="hex">#8330C7</span></div>
      <div class="stop"><span class="sw" style="background:#E62F9A"></span><span class="hex">#E62F9A</span></div>
      <div class="stop"><span class="sw" style="background:#FF2C61"></span><span class="hex">#FF2C61</span></div>
      <div class="stop"><span class="sw" style="background:#FF2E0D"></span><span class="hex">#FF2E0D</span></div>
    </div>
  </div>
</body>
</html>
