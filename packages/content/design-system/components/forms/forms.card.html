<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-jp); background: var(--surface-sunk); padding: 22px; }
  .panel { background: #fff; border-radius: 14px; padding: 20px; box-shadow: var(--shadow-sm); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Switch } = window.SportsForceTechBoostDesignSystem_381be8;
    function Demo() {
      const [a, setA] = React.useState(true);
      const [b, setB] = React.useState(false);
      return (
        <div className="panel grid">
          <div className="stack">
            <Input label="会社名" placeholder="株式会社サンプル" required />
            <Input label="メールアドレス" type="email" placeholder="name@example.com" hint="ご返信先のアドレス" />
          </div>
          <div className="stack">
            <Input label="電話番号" defaultValue="03-1234" error="正しい番号を入力してください" />
            <div className="stack" style={{ gap: 12, paddingTop: 4 }}>
              <Switch checked={a} onChange={setA} label="メールで連絡を受け取る" />
              <Switch checked={b} onChange={setB} label="資料を同送する" />
              <Switch checked disabled label="（無効）" size="sm" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
