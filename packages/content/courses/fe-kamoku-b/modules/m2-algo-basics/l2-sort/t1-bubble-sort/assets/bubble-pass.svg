<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 1200 504" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 比較する隣どうしをinkの太枠で示す。焦点は末尾に確定した最大値1つ(accent) -->
  <rect x="288" y="96" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <rect x="384" y="96" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <rect x="480" y="96" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="576" y="96" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="336" y="140" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">5</text>
  <text x="432" y="140" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>
  <text x="528" y="140" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">8</text>
  <text x="624" y="140" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>
  <text x="720" y="140" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">5 &gt; 3 → 交換する</text>

  <line x1="480" y1="176" x2="480" y2="208" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="288" y="216" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="384" y="216" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <rect x="480" y="216" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <rect x="576" y="216" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="336" y="260" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>
  <text x="432" y="260" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">5</text>
  <text x="528" y="260" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">8</text>
  <text x="624" y="260" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>
  <text x="720" y="260" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">5 &lt; 8 → そのまま</text>

  <line x1="480" y1="296" x2="480" y2="328" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="288" y="336" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="384" y="336" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="480" y="336" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <rect x="576" y="336" width="96" height="72" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2.5"/>
  <text x="336" y="380" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>
  <text x="432" y="380" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">5</text>
  <text x="528" y="380" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">8</text>
  <text x="624" y="380" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>
  <text x="720" y="380" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">8 &gt; 1 → 交換する</text>

  <line x1="480" y1="416" x2="480" y2="448" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="288" y="456" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="384" y="456" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="480" y="456" width="96" height="72" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="576" y="456" width="96" height="72" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2.5"/>
  <text x="336" y="500" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>
  <text x="432" y="500" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">5</text>
  <text x="528" y="500" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>
  <text x="624" y="500" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">8</text>
  <text x="720" y="500" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">最大値 8 が末尾に確定</text>
</svg>