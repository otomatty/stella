<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 72 1200 348" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E62F9A"/>
    </marker>
  </defs>

  <text x="288" y="120" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">プログラム</text>
  <text x="856" y="120" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">トレース表</text>

  <!-- プログラム(擬似言語) -->
  <rect x="96" y="152" width="384" height="224" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="136" y="204" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">x ← 1</text>
  <text x="136" y="248" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">while (x &lt; 4)</text>
  <text x="168" y="292" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">x ← x + 2</text>
  <text x="136" y="336" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">endwhile</text>

  <!-- 焦点: 1行実行するごとに、表に1行書き足す(accent) -->
  <line x1="484" y1="264" x2="600" y2="264" stroke="#E62F9A" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="544" y="236" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1行ずつ書き出す</text>

  <!-- トレース表(行 = 実行ステップ、列 = 変数) -->
  <rect x="608" y="152" width="352" height="56" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="784" y="188" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">実行した行</text>
  <rect x="960" y="152" width="144" height="56" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="1032" y="188" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">x</text>

  <rect x="608" y="208" width="352" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="784" y="244" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">x ← 1</text>
  <rect x="960" y="208" width="144" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="1032" y="244" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>

  <rect x="608" y="264" width="352" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="784" y="300" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">x ← x + 2</text>
  <rect x="960" y="264" width="144" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="1032" y="300" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>

  <rect x="608" y="320" width="352" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="784" y="356" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">x ← x + 2</text>
  <rect x="960" y="320" width="144" height="56" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="1032" y="356" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">5</text>
</svg>