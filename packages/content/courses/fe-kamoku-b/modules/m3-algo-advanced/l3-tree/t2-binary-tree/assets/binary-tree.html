<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>二分木の親と子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 64 1200 456" width="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- 各節の子は左右2つまで。焦点は「子であり親でもある」B(accent) -->
  <path d="M600 152 L600 188 M408 188 L792 188 M408 188 L408 224 M792 188 L792 224"
        fill="none" stroke="#B7B7BE" stroke-width="1.5"/>
  <path d="M408 280 L408 316 M312 316 L504 316 M312 316 L312 352 M504 316 L504 352"
        fill="none" stroke="#B7B7BE" stroke-width="1.5"/>

  <text x="396" y="212" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">左の子</text>
  <text x="804" y="212" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">右の子</text>

  <rect x="552" y="96" width="96" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="600" y="132" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">A</text>

  <rect x="360" y="224" width="96" height="56" rx="8" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="408" y="260" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">B</text>

  <rect x="744" y="224" width="96" height="56" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="792" y="260" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">C</text>

  <rect x="264" y="352" width="96" height="56" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="312" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">D</text>

  <rect x="456" y="352" width="96" height="56" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="504" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">E</text>

  <text x="600" y="472" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">B は、A の子であり D と E の親でもある</text>
</svg>
</body>
</html>
