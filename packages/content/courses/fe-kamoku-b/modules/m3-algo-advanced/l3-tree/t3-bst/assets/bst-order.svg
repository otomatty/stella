<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 1200 456" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <!-- 8,3,10,1,6 を順に入れた二分探索木。焦点は比較を2回経て置き場所が決まった6(accent) -->
  <path d="M600 152 L600 188 M408 188 L792 188 M408 188 L408 224 M792 188 L792 224"
        fill="none" stroke="#B7B7BE" stroke-width="1.5"/>
  <path d="M408 280 L408 316 M312 316 L504 316 M312 316 L312 352 M504 316 L504 352"
        fill="none" stroke="#B7B7BE" stroke-width="1.5"/>

  <text x="396" y="212" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">8 より小さい</text>
  <text x="804" y="212" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">8 より大きい</text>
  <text x="300" y="340" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">3 より小さい</text>
  <text x="516" y="340" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">3 より大きい</text>

  <rect x="552" y="96" width="96" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="600" y="132" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">8</text>

  <rect x="360" y="224" width="96" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="408" y="260" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>

  <rect x="744" y="224" width="96" height="56" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="792" y="260" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">10</text>

  <rect x="264" y="352" width="96" height="56" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="312" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>

  <rect x="456" y="352" width="96" height="56" rx="8" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="504" y="388" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">6</text>

  <text x="600" y="472" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">どの節でも、左の側は親より小さく、右の側は大きい</text>
</svg>