<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キューのエンキューとデキュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 136 1200 296" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 入口と出口が別の筒。1→2→3の順にエンキューした状態。焦点は先頭の1(accent) -->
  <line x1="320" y1="200" x2="880" y2="200" stroke="#B7B7BE" stroke-width="2.5"/>
  <line x1="320" y1="312" x2="880" y2="312" stroke="#B7B7BE" stroke-width="2.5"/>

  <line x1="1032" y1="256" x2="912" y2="256" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="972" y="184" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">エンキュー(入れる)</text>

  <line x1="288" y1="256" x2="168" y2="256" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="228" y="184" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">デキュー(取り出す)</text>

  <rect x="352" y="216" width="144" height="80" rx="8" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="424" y="264" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">1</text>

  <rect x="528" y="216" width="144" height="80" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="600" y="264" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">2</text>

  <rect x="704" y="216" width="144" height="80" rx="8" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="776" y="264" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">3</text>

  <text x="600" y="384" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">最初に入れた 1 が、最初に取り出される</text>
</svg>
</body>
</html>
