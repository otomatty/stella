    </marker>
  </defs>

  <line x1="640" y1="192" x2="640" y2="256" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="360" x2="640" y2="424" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M400 192 L384 192 L384 528 L400 528" fill="none" stroke="#E62F9A" stroke-width="2"/>
