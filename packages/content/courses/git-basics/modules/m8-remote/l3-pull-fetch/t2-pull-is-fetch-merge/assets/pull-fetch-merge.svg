<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 64 1200 576" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
