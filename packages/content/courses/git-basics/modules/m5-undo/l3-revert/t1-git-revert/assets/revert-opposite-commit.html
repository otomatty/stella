<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>git revertは反対の変更を新しいコミットとして積む</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 176 1200 304" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <line x1="512" y1="272" x2="680" y2="272" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="248" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">git revert</text>
  <text x="596" y="304" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">反対の変更を積む</text>

  <rect x="192" y="208" width="320" height="128" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="352" y="248" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#5C5C66">a1b2c3d</text>
  <text x="352" y="284" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">価格表を更新</text>
  <text x="352" y="316" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">行を足したコミット</text>

  <rect x="688" y="208" width="320" height="128" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="848" y="248" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#5C5C66">f9e8d7c</text>
  <text x="848" y="284" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">反対の変更</text>
  <text x="848" y="316" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">足した行を消すコミット</text>

  <text x="352" y="376" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">元のコミットはそのまま残る</text>
  <text x="848" y="376" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">履歴が1つ増えるだけ</text>
</svg>
</body>
</html>
