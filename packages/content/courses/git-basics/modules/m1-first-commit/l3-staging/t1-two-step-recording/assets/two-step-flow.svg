      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <line x1="600" y1="192" x2="600" y2="256" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="600" y2="424" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="96" width="480" height="96" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
