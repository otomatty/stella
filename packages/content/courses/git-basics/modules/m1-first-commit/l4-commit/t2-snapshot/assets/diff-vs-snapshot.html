<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>コミットは差分のメモではなくスナップショット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 64 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">

  <rect x="384" y="96" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="132" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">差分のメモ</text>
  <text x="560" y="164" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">よくある誤解</text>

  <rect x="768" y="96" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="132" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">スナップショット</text>
  <text x="944" y="164" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">実際のコミット</text>

  <text x="352" y="272" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">コミット2の中身</text>
  <rect x="384" y="216" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="268" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">変えた部分のメモだけ</text>
  <rect x="768" y="216" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="268" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">全ファイルの写真</text>

  <text x="352" y="380" text-anchor="end" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">その1つだけで</text>
  <text x="352" y="408" text-anchor="end" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">全体に戻れるか</text>

  <rect x="384" y="336" width="352" height="104" rx="12"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="560" y="380" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">戻れない</text>
  <text x="560" y="412" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">前の分をたどる必要がある</text>

  <rect x="768" y="336" width="352" height="104" rx="12"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="944" y="380" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">戻れる</text>
  <text x="944" y="412" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">その1枚で全部そろう</text>
</svg>
</body>
</html>
