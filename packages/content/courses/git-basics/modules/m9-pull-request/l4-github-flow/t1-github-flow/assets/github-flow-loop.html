<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GitHub Flowはmainから枝を出しPRで戻す繰り返し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 128 1200 272" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E62F9A"/>
    </marker>
  </defs>

  <line x1="320" y1="216" x2="360" y2="216" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="608" y1="216" x2="648" y2="216" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="896" y1="216" x2="936" y2="216" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1064 272 L1064 352 L200 352 L200 280" fill="none" stroke="#E62F9A" stroke-width="2"
        marker-end="url(#arrow-accent)"/>
  <text x="632" y="340" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">また main から繰り返す</text>

  <rect x="80" y="160" width="240" height="112" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="200" y="208" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">枝を出す</text>
  <text x="200" y="244" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">出発点はいつも main</text>

  <rect x="368" y="160" width="240" height="112" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="488" y="208" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">コミットを積む</text>
  <text x="488" y="244" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">枝の上で作業する</text>

  <rect x="656" y="160" width="240" height="112" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="776" y="208" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">push して PR を開く</text>
  <text x="776" y="244" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">レビューを受ける</text>

  <rect x="944" y="160" width="240" height="112" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="1064" y="208" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">main へマージ</text>
  <text x="1064" y="244" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">枝は削除する</text>
</svg>
</body>
</html>
