        font-family="'Geist Mono', monospace" fill="#5C5C66">typeof</text>

  <line x1="664" y1="300" x2="760" y2="300" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="284" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">keyof</text>

  <!-- 値 -->
  <rect x="80" y="248" width="168" height="104" rx="12"
