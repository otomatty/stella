<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>値の引数と同じ発想を、型にも広げる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 496" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- 列見出し -->
  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="220" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">値の引数</text>
  <text x="560" y="252" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">いつもの引数</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="944" y="220" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">型引数</text>
  <text x="944" y="252" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ジェネリクス</text>

  <!-- 行1: 渡すもの -->
  <text x="352" y="344" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">渡すもの</text>
  <rect x="384" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">"佐藤"</text>
  <rect x="768" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string</text>

  <!-- 行2: 受け取る場所 -->
  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">受け取る場所</text>
  <rect x="384" y="416" width="352" height="104" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="476" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">引数 a</text>
  <rect x="768" y="416" width="352" height="104" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="476" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">型引数 T</text>

  <text x="600" y="600" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">引数 a に値が入るように、型引数 T には型が入る</text>
</svg>
</body>
</html>
