<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 144 1200 336" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>

  <!-- 見出し行: どちらの操作か -->
  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="224" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">items.push("紅茶")</text>
  <text x="560" y="248" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">中身を書き換える</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="224" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">items = ["緑茶"]</text>
  <text x="944" y="248" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">配列ごと差し替える</text>

  <!-- 行ラベル -->
  <text x="352" y="356" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">実行結果</text>

  <!-- OK: 中身の変更 -->
  <rect x="384" y="296" width="352" height="112" rx="12"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="560" y="344" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">配列の中身が変わる</text>
  <text x="560" y="380" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">OK</text>

  <!-- NG: 再代入 -->
  <rect x="768" y="296" width="352" height="112" rx="12"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="944" y="344" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">エラーになる</text>
  <text x="944" y="380" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">再代入はできない</text>

  <text x="600" y="452" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">constが固定するのは変数の貼り先、中身ではない</text>
</svg>