<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>関数を渡して、あとで呼び出してもらう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 336" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E62F9A"/>
    </marker>
  </defs>


  <!-- アクター -->
  <rect x="80" y="176" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="188" y="208" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">呼び出し元</text>

  <rect x="492" y="176" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="600" y="208" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">greetUser</text>

  <rect x="904" y="176" width="216" height="56" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="1012" y="208" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">casual(fn)</text>

  <!-- ライフライン -->
  <line x1="188" y1="232" x2="188" y2="424" stroke="#B7B7BE" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="232" x2="600" y2="424" stroke="#B7B7BE" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="1012" y1="232" x2="1012" y2="424" stroke="#B7B7BE" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- アクティベーションバー -->
  <rect x="596" y="256" width="8" height="132" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>
  <rect x="1008" y="288" width="8" height="56" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="1.5"/>

  <!-- 1: 呼び出し元 → greetUser(accent) -->
  <line x1="188" y1="256" x2="592" y2="256" stroke="#E62F9A" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="252" y="236" width="264" height="24" fill="#FFFFFF"/>
  <text x="384" y="252" text-anchor="middle" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">greetUser("田中", casual)</text>

  <!-- 2: greetUser → casual(fn) -->
  <line x1="604" y1="288" x2="1004" y2="288" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="736" y="268" width="140" height="24" fill="#FFFFFF"/>
  <text x="804" y="284" text-anchor="middle" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">fn("田中")</text>

  <!-- 3: casual(fn) --> greetUser(戻り、破線) -->
  <line x1="1008" y1="344" x2="608" y2="344" stroke="#5C5C66" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="712" y="324" width="192" height="24" fill="#FFFFFF"/>
  <text x="808" y="340" text-anchor="middle" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">"やあ、田中!"</text>

  <!-- 4: greetUser --> 呼び出し元(戻り、破線) -->
  <line x1="596" y1="384" x2="192" y2="384" stroke="#5C5C66" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="300" y="364" width="192" height="24" fill="#FFFFFF"/>
  <text x="396" y="380" text-anchor="middle" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">"やあ、田中!"</text>

  <text x="600" y="444" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">渡した関数を、greetUserの中で呼び返している</text>
</svg>
</body>
</html>
