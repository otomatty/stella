<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>入力を受け取り、結果を返す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 168 1200 312" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <line x1="368" y1="268" x2="432" y2="268" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="764" y1="268" x2="828" y2="268" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="96" y="208" width="256" height="120" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="224" y="256" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">引数(入力)</text>
  <text x="224" y="296" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#5C5C66">1000</text>

  <rect x="452" y="200" width="296" height="136" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">関数 addTax</text>
  <text x="600" y="292" text-anchor="middle" font-size="20" font-weight="400"
        font-family="'Geist Mono', monospace" fill="#5C5C66">price * 1.1</text>

  <rect x="848" y="208" width="256" height="120" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="976" y="256" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">戻り値(出力)</text>
  <text x="976" y="296" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#5C5C66">1100</text>

  <text x="600" y="420" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">同じ入力を渡せば、いつでも同じ結果を返してくれる部品です</text>
</svg>
</body>
</html>
