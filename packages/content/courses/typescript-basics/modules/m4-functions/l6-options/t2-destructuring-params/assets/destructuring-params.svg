<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 132 1200 348" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 渡すオブジェクト -->
  <rect x="80" y="176" width="336" height="216" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="104" y="164" width="176" height="24" fill="#FFFFFF"/>
  <text x="112" y="180" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">渡すオブジェクト</text>

  <rect x="104" y="212" width="288" height="72" rx="8" fill="#F7F7F9" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="248" y="256" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">name: "田中"</text>

  <rect x="104" y="304" width="288" height="72" rx="8" fill="#F7F7F9" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="248" y="348" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">age: 28</text>

  <!-- 矢印(受け取り) -->
  <line x1="416" y1="248" x2="784" y2="248" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="416" y1="340" x2="784" y2="340" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="228" width="200" height="24" fill="#FFFFFF"/>
  <text x="600" y="244" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#E62F9A">{ name, age }</text>

  <!-- 関数の中 -->
  <rect x="784" y="176" width="336" height="216" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="808" y="164" width="128" height="24" fill="#FFFFFF"/>
  <text x="816" y="180" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">関数の中</text>

  <rect x="808" y="212" width="288" height="72" rx="8" fill="#F7F7F9" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="952" y="256" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">name = "田中"</text>

  <rect x="808" y="304" width="288" height="72" rx="8" fill="#F7F7F9" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="952" y="348" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">age = 28</text>

  <text x="600" y="436" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">プロパティ名と同じ変数として、そのまま使える</text>
</svg>