<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>分岐のたびに型が狭まる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 132 1200 348" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 開始: 分岐前の型 -->
  <rect x="132" y="248" width="256" height="64" rx="20"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="260" y="288" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string | undefined</text>

  <line x1="388" y1="280" x2="428" y2="280" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判定(焦点: 型ガード) -->
  <polygon points="588,208 748,280 588,352 428,280"
           fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="588" y="272" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">value !==</text>
  <text x="588" y="296" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">undefined</text>

  <!-- Yes -> stringに確定 -->
  <line x1="748" y1="280" x2="748" y2="204" stroke="#5C5C66" stroke-width="2"/>
  <line x1="748" y1="204" x2="808" y2="204" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="768" y="188" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">Yes</text>

  <rect x="808" y="164" width="280" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="948" y="200" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">string に確定</text>
  <text x="948" y="228" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">if の中</text>

  <!-- No -> undefinedに確定 -->
  <line x1="748" y1="280" x2="748" y2="356" stroke="#5C5C66" stroke-width="2"/>
  <line x1="748" y1="356" x2="808" y2="356" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="768" y="376" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">No</text>

  <rect x="808" y="316" width="280" height="80" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="948" y="352" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">undefined に確定</text>
  <text x="948" y="380" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">else の中</text>
</svg>
</body>
</html>
