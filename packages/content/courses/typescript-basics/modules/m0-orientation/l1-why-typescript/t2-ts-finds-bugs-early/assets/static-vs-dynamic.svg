<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 156 1200 336" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 開始: 同じコードを書く -->
  <rect x="80" y="288" width="240" height="64" rx="20"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="200" y="328" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">コードを書く</text>

  <!-- 分岐: 開始からTypeScript経路とJavaScript経路へ -->
  <line x1="324" y1="320" x2="376" y2="320" stroke="#5C5C66" stroke-width="2"/>
  <circle cx="376" cy="320" r="4" fill="#0E0E10"/>
  <line x1="376" y1="320" x2="376" y2="240" stroke="#5C5C66" stroke-width="2"/>
  <line x1="376" y1="240" x2="556" y2="240" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="320" x2="376" y2="400" stroke="#5C5C66" stroke-width="2"/>
  <line x1="376" y1="400" x2="556" y2="400" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="468" y="224" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">TypeScript</text>
  <text x="468" y="424" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">JavaScript</text>

  <!-- TypeScript経路: 書いた直後にコンパイラーがエラーを出す(短い経路) -->
  <rect x="560" y="188" width="320" height="104" rx="20"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="720" y="228" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">エラー</text>
  <text x="720" y="264" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">実行する前に</text>

  <!-- JavaScript経路: 実行するところまで進んでからエラーに気づく(長い経路) -->
  <rect x="560" y="368" width="200" height="64" rx="8"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="660" y="408" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">実行する</text>

  <line x1="764" y1="400" x2="836" y2="400" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="840" y="348" width="320" height="104" rx="20"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="1000" y="388" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">エラー</text>
  <text x="1000" y="424" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">実行したあとに</text>
</svg>