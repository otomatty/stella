<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>見た目を整えるか、問題を指摘するか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 136 1200 424" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- column headers -->
  <rect x="384" y="168" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="224" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">Prettier</text>

  <rect x="768" y="168" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="224" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">ESLint</text>

  <!-- row 1: 役割 -->
  <text x="352" y="328" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">役割</text>
  <rect x="384" y="280" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="332" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">見た目を整える</text>
  <rect x="768" y="280" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="332" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">問題を指摘する</text>

  <!-- row 2: 例 -->
  <text x="352" y="440" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">例</text>
  <rect x="384" y="392" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="444" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">インデント・改行など</text>
  <rect x="768" y="392" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="444" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">未使用の変数など</text>
</svg>
</body>
</html>
