<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 124 1200 356" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>

  <!-- outer: strict: true (the containing set) -->
  <rect x="140" y="168" width="920" height="248" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="164" y="156" width="184" height="24" fill="#FFFFFF"/>
  <text x="172" y="172" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">STRICT: TRUE</text>

  <!-- inner: strictNullChecks, the one option already familiar (focus) -->
  <rect x="200" y="232" width="320" height="140" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="360" y="292" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">strictNullChecks</text>
  <text x="360" y="328" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">null事故を防ぐ</text>

  <text x="700" y="292" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">ほかにも複数の設定が</text>
  <text x="700" y="328" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">同時にONになる</text>
</svg>