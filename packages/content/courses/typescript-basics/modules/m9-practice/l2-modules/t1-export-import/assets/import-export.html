<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>公開したものだけが渡る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 168 1200 312" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- tax.ts: exports calcTax -->
  <rect x="104" y="200" width="304" height="104" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="256" y="244" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">export calcTax</text>
  <text x="256" y="280" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">tax.ts</text>

  <!-- private RATE: stays inside, no arrow leaves this box -->
  <rect x="104" y="328" width="304" height="104" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="256" y="372" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#5C5C66">const RATE</text>
  <text x="256" y="404" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">非公開のまま</text>

  <!-- arrow: only the exported one crosses -->
  <line x1="408" y1="252" x2="784" y2="252" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="236" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">import</text>

  <!-- main.ts: imports calcTax (focus) -->
  <rect x="792" y="200" width="304" height="104" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="944" y="244" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">import calcTax</text>
  <text x="944" y="280" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">main.ts</text>
</svg>
</body>
</html>
