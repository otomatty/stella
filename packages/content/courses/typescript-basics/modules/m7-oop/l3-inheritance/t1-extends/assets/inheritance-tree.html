<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>親の持ち物を子が受け継ぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- root: 親クラス -->
  <rect x="440" y="176" width="320" height="120" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="600" y="216" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">Member</text>
  <text x="600" y="240" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">(親クラス)</text>
  <text x="600" y="272" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">protected name, greet()</text>

  <!-- connector -->
  <line x1="600" y1="296" x2="600" y2="328" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="616" y="316" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">extends</text>

  <!-- child: 子クラス(focal) -->
  <rect x="400" y="328" width="400" height="136" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="368" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">PremiumMember</text>
  <text x="600" y="392" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">(子クラス)</text>
  <text x="600" y="412" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">protected name, greet()</text>
  <text x="600" y="440" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">→ 継承される</text>
</svg>
</body>
</html>
