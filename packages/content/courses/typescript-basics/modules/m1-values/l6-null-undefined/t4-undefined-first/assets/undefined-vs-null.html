<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>undefinedとnull ― 2つの「値がない」</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 496" width="1200" xmlns="http://www.w3.org/2000/svg">

  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="560" y="228" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">undefined</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="228" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">null</text>

  <text x="352" y="344" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">発生の仕方</text>
  <rect x="384" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">自動的に発生する</text>
  <rect x="768" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">人が意図して入れる</text>

  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">使う場面</text>
  <rect x="384" y="416" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="468" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">初期値なしの変数</text>
  <rect x="768" y="416" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="468" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">空だと明示したいとき</text>

  <text x="600" y="560" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">迷ったら undefined に寄せます</text>
</svg>
</body>
</html>
