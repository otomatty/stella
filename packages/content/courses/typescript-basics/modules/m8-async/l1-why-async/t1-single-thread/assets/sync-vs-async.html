<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>待つと全部止まる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 156 1200 324" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 時間軸 -->
  <line x1="120" y1="256" x2="1080" y2="256" stroke="#B7B7BE" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="120" y="228" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">時間</text>

  <!-- 処理A -->
  <circle cx="200" cy="256" r="8" fill="#8A8A93"/>
  <text x="200" y="212" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">処理A</text>

  <!-- 通信Bのブロック区間(焦点) -->
  <line x1="360" y1="256" x2="840" y2="256" stroke="#E62F9A" stroke-width="8" stroke-linecap="round"/>
  <text x="600" y="212" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">通信B(3秒かかる)</text>
  <text x="600" y="304" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">この間、画面は反応しない</text>

  <!-- 処理C -->
  <circle cx="1000" cy="256" r="8" fill="#8A8A93"/>
  <text x="1000" y="212" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">処理C</text>

  <text x="600" y="404" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">担当者は1人。前が終わるまで次は始まらない</text>
</svg>
</body>
</html>
