<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>失敗したらcatchへ移る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 136 1200 504" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 開始 -->
  <rect x="432" y="168" width="192" height="48" rx="20" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="528" y="196" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">開始</text>

  <line x1="528" y1="216" x2="528" y2="240" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tryブロック -->
  <rect x="384" y="240" width="288" height="64" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="528" y="280" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">tryでawaitする</text>

  <line x1="528" y1="304" x2="528" y2="328" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判定 -->
  <polygon points="528,328 688,392 528,456 368,392"
           fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="528" y="400" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">成功した?</text>

  <!-- 成功: そのまま続きへ -->
  <line x1="688" y1="392" x2="768" y2="392" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="380" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">成功</text>

  <rect x="768" y="360" width="280" height="64" rx="12" fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="908" y="400" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">次の行へ進む</text>

  <!-- 失敗: catchへ -->
  <line x1="528" y1="456" x2="528" y2="496" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="488" y="480" text-anchor="end" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">失敗</text>

  <rect x="384" y="496" width="288" height="64" rx="12" fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="528" y="536" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">catchブロックへ</text>
</svg>
</body>
</html>
