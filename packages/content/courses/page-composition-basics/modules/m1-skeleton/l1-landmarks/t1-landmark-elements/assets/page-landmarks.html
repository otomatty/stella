<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ページのlandmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 32 1200 576" width="1200" xmlns="http://www.w3.org/2000/svg">
  <rect x="240" y="64" width="720" height="504" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>

  <rect x="272" y="104" width="656" height="88" rx="8"
        fill="#F7F7F9" stroke="#5C5C66" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">header</text>
  <text x="600" y="172" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ロゴ・ナビ(nav)</text>

  <rect x="272" y="216" width="656" height="216" rx="8"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">main</text>
  <text x="600" y="344" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">そのページの主役。1ページに1つ</text>

  <rect x="272" y="456" width="656" height="80" rx="8"
        fill="#F7F7F9" stroke="#5C5C66" stroke-width="2"/>
  <text x="600" y="492" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">footer</text>
  <text x="600" y="520" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">著作権表示・補助リンク</text>
</svg>
</body>
</html>
