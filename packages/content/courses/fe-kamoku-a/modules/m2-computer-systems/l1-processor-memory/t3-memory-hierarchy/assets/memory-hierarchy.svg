<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 28 1200 448" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>

  <!-- 3層のスタック。焦点はキャッシュメモリの層1つ(accent) -->
  <rect x="280" y="96" width="640" height="288" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <line x1="280" y1="192" x2="920" y2="192" stroke="#DDDDE2" stroke-width="1.5"/>
  <line x1="280" y1="288" x2="920" y2="288" stroke="#DDDDE2" stroke-width="1.5"/>
  <rect x="280" y="192" width="640" height="96" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>

  <text x="320" y="148" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">01</text>
  <text x="368" y="152" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">レジスタ</text>
  <text x="888" y="152" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">CPU内部の置き場</text>

  <text x="320" y="244" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">02</text>
  <text x="368" y="248" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">キャッシュメモリ</text>
  <text x="888" y="248" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">速度差を埋める中継役</text>

  <text x="320" y="340" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">03</text>
  <text x="368" y="344" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">主記憶</text>
  <text x="888" y="344" text-anchor="end" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">大きいが、遅い</text>

  <!-- 左: アクセス時間の向き / 右: 容量の向き -->
  <line x1="232" y1="384" x2="232" y2="100" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="76" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">速い</text>
  <text x="232" y="416" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">遅い</text>

  <line x1="968" y1="96" x2="968" y2="380" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="968" y="76" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">小さい</text>
  <text x="968" y="416" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">大きい</text>
</svg>