<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 100 1200 460" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E62F9A"/>
    </marker>
  </defs>

  <!-- 2軸(成長率×占有率)の4分類。焦点は「金のなる木で稼ぎ、問題児に投資」の1本(accent) -->
  <text x="560" y="152" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">占有率が高い</text>
  <text x="944" y="152" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">占有率が低い</text>

  <text x="352" y="268" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">成長率が高い</text>
  <text x="352" y="452" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">成長率が低い</text>

  <path d="M560 368 L560 352 L944 352 L944 340" fill="none"
        stroke="#E62F9A" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <rect x="672" y="336" width="160" height="32" fill="#FFFFFF"/>
  <text x="752" y="360" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">資金を投資する</text>

  <rect x="384" y="184" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="252" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">花形</text>
  <text x="560" y="292" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">主力として伸ばす</text>

  <rect x="768" y="184" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="252" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">問題児</text>
  <text x="944" y="292" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">投資して花形に育てる</text>

  <rect x="384" y="368" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="436" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">金のなる木</text>
  <text x="560" y="476" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">安定して稼ぐ</text>

  <rect x="768" y="368" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="436" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">負け犬</text>
  <text x="944" y="476" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">撤退を検討する</text>
</svg>