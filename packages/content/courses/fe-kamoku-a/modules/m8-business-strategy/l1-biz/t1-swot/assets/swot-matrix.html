<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SWOT分析の4象限</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 100 1200 460" width="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- 2軸(内部/外部 × 良い/悪い)の4象限。例は駅前の喫茶店 -->
  <text x="560" y="152" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">良い影響</text>
  <text x="944" y="152" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">悪い影響</text>

  <text x="352" y="248" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">内部要因</text>
  <text x="352" y="280" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">自社で変えられる</text>

  <rect x="384" y="184" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="416" y="220" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">S</text>
  <text x="560" y="260" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">強み</text>
  <text x="560" y="300" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">常連客が多い</text>

  <rect x="768" y="184" width="352" height="152" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="800" y="220" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">W</text>
  <text x="944" y="260" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">弱み</text>
  <text x="944" y="300" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">席が少ない</text>

  <text x="352" y="432" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">外部要因</text>
  <text x="352" y="464" text-anchor="end" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">自社では変えられない</text>

  <rect x="384" y="368" width="352" height="152" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="416" y="404" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">O</text>
  <text x="560" y="444" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">機会</text>
  <text x="560" y="484" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">近くに大学ができる</text>

  <rect x="768" y="368" width="352" height="152" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="800" y="404" text-anchor="middle" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="'Figtree', sans-serif" fill="#8A8A93">T</text>
  <text x="944" y="444" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">脅威</text>
  <text x="944" y="484" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">大手チェーンの出店</text>
</svg>
</body>
</html>
