<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>アローダイアグラムとクリティカルパス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 120 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E0E10"/>
    </marker>
  </defs>

  <!-- 最長経路(開始→A→B→完了)を太いinkで、余裕のある経路を細いmutedで描く -->
  <line x1="208" y1="304" x2="284" y2="304" stroke="#0E0E10" stroke-width="2.5" marker-end="url(#arrow-ink)"/>
  <path d="M352 264 L352 192 L492 192" fill="none" stroke="#0E0E10" stroke-width="2.5" marker-end="url(#arrow-ink)"/>
  <path d="M624 192 L960 192 L960 260" fill="none" stroke="#0E0E10" stroke-width="2.5" marker-end="url(#arrow-ink)"/>

  <path d="M352 344 L352 416 L492 416" fill="none" stroke="#5C5C66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="624" y1="416" x2="684" y2="416" stroke="#5C5C66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M816 416 L960 416 L960 348" fill="none" stroke="#5C5C66" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="264" width="128" height="80" rx="20" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="144" y="312" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">開始</text>

  <rect x="288" y="264" width="128" height="80" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="352" y="300" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">A</text>
  <text x="352" y="328" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">2日</text>

  <rect x="496" y="152" width="128" height="80" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="188" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">B</text>
  <text x="560" y="216" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">3日</text>

  <rect x="496" y="376" width="128" height="80" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="412" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">C</text>
  <text x="560" y="440" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1日</text>

  <rect x="688" y="376" width="128" height="80" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="752" y="412" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">D</text>
  <text x="752" y="440" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1日</text>

  <rect x="896" y="264" width="128" height="80" rx="20" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="960" y="312" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">完了</text>

  <text x="792" y="168" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">クリティカルパス = 5日</text>
  <text x="688" y="488" text-anchor="middle" font-size="16"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">A → C → D は 4日(1日の余裕がある)</text>
</svg>
</body>
</html>
