<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ブロックとインラインの並び方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 96 1200 480" width="1200" xmlns="http://www.w3.org/2000/svg">

  <rect x="80" y="128" width="464" height="72" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="312" y="176" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">ブロック</text>

  <rect x="656" y="128" width="464" height="72" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="888" y="176" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">インライン</text>

  <rect x="80" y="240" width="464" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <rect x="80" y="328" width="464" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <rect x="80" y="416" width="464" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <text x="312" y="536" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">横幅いっぱいを取り、縦に積まれる</text>

  <rect x="656" y="240" width="128" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <rect x="800" y="240" width="176" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <rect x="992" y="240" width="128" height="72" rx="8"
        fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <text x="888" y="536" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">中身の幅だけを取り、横に並ぶ</text>
</svg>
</body>
</html>
