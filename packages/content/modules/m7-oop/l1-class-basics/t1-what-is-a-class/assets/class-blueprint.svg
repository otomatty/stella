  <text x="860" y="356" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">name: "紅茶"</text>
  <text x="860" y="384" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">price: 320</text>
</svg>