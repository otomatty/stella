  <text x="600" y="224" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">name / price</text>

  <!-- connectors: root -> bus -> 2 children (orthogonal) -->
  <line x1="600" y1="236" x2="600" y2="264" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="340" y1="264" x2="860" y2="264" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="340" y1="264" x2="340" y2="292" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="860" y1="264" x2="860" y2="292" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="612" y="256" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">new</text>

  <!-- child 1: item1 -->
  <rect x="180" y="292" width="320" height="116" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="340" y="324" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">item1</text>
  <text x="340" y="356" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">name: "コーヒー"</text>
  <text x="340" y="384" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">price: 480</text>

  <!-- child 2: item2 -->
  <rect x="700" y="292" width="320" height="116" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="860" y="324" text-anchor="middle" font-size="24" font-weight="500"
