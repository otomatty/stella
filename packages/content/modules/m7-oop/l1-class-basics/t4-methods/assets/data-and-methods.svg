<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 112 1200 448" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- outer: class Product -->
  <rect x="280" y="156" width="640" height="308" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="304" y="144" width="200" height="24" fill="#FFFFFF"/>
  <text x="312" y="160" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">CLASS PRODUCT</text>

  <!-- zone1: プロパティ(データ) -->
  <rect x="320" y="200" width="560" height="96" rx="12" fill="#F7F7F9" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="352" y="232" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">プロパティ</text>
  <text x="352" y="264" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">name: string / price: number</text>

  <!-- this: method -> data -->
  <line x1="600" y1="328" x2="600" y2="296" stroke="#5C5C66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="616" y="316" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">this</text>

  <!-- zone2: メソッド(処理、focal) -->
  <rect x="320" y="328" width="560" height="112" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="352" y="360" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">メソッド</text>
  <text x="352" y="392" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">taxIncluded(): number</text>
</svg>