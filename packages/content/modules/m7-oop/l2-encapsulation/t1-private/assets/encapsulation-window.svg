<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 132 1200 428" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- outer: class Stock(境界) -->
  <rect x="680" y="176" width="440" height="308" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="704" y="164" width="180" height="24" fill="#FFFFFF"/>
  <text x="712" y="180" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">CLASS STOCK</text>

  <!-- zoneA: private count(隠す、破線) -->
  <rect x="720" y="220" width="360" height="104" rx="12" fill="#F7F7F9" stroke="#8A8A93" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="900" y="260" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">private count</text>
  <text x="900" y="288" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">外からアクセスできない</text>

  <!-- zoneB: add(n)(窓口) -->
  <rect x="720" y="356" width="360" height="104" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="900" y="396" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">add(n: number)</text>
  <text x="900" y="424" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">窓口(公開メソッド)</text>

  <!-- this: method -> private data -->
  <line x1="900" y1="356" x2="900" y2="324" stroke="#5C5C66" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="916" y="344" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">this</text>

  <!-- NG: 直接アクセス -->
  <rect x="80" y="228" width="440" height="88" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="300" y="276" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">stock.count = -100;</text>
  <line x1="520" y1="272" x2="568" y2="272" stroke="#5C5C66" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <rect x="568" y="252" width="64" height="40" rx="20" fill="#E5342B"/>
  <text x="600" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">NG</text>

  <!-- OK: メソッド経由 -->
  <rect x="80" y="364" width="440" height="88" rx="12" fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="300" y="412" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">stock.add(5);</text>
  <line x1="520" y1="408" x2="568" y2="408" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="568" y="388" width="64" height="40" rx="20" fill="#16A34A"/>
  <text x="600" y="416" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">OK</text>
  <line x1="632" y1="408" x2="716" y2="408" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
</svg>