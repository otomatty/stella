<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>形が合えばimplementsなしでも代入できる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 132 1200 428" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- outer: Shape型が求める形 -->
  <rect x="340" y="176" width="520" height="328" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="364" y="164" width="120" height="24" fill="#FFFFFF"/>
  <text x="372" y="180" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">SHAPE</text>

  <text x="600" y="232" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">name: string</text>
  <text x="600" y="264" text-anchor="middle" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">area(): number</text>

  <!-- inner: Rectangle(形が一致、focal) -->
  <rect x="420" y="316" width="360" height="164" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="444" y="304" width="160" height="24" fill="#FFFFFF"/>
  <text x="452" y="320" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">RECTANGLE</text>
  <text x="600" y="364" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">Rectangle</text>
  <text x="600" y="388" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">(implementsなし)</text>
  <text x="600" y="420" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">形が一致 → 代入できる</text>
</svg>
</body>
</html>
