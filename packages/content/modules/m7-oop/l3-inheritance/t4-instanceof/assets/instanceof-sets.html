<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>子は親のインスタンスでもある</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 132 1200 508" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- outer: Memberのインスタンス全体 -->
  <rect x="160" y="176" width="560" height="344" rx="12" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="184" y="164" width="140" height="24" fill="#FFFFFF"/>
  <text x="192" y="180" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">MEMBER</text>

  <!-- inner: PremiumMemberのインスタンス(部分集合、focal) -->
  <rect x="240" y="284" width="400" height="196" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="264" y="272" width="220" height="24" fill="#FFFFFF"/>
  <text x="272" y="288" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">PREMIUMMEMBER</text>

  <!-- points -->
  <circle cx="310" cy="228" r="8" fill="#0E0E10"/>
  <text x="332" y="228" font-size="20" font-weight="500" font-family="'Geist Mono', monospace" fill="#0E0E10">sato</text>

  <circle cx="310" cy="360" r="8" fill="#0E0E10"/>
  <text x="332" y="368" font-size="20" font-weight="500" font-family="'Geist Mono', monospace" fill="#0E0E10">tanaka</text>

  <!-- results(中立、色分けなし) -->
  <text x="740" y="300" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">tanaka instanceof Member</text>
  <text x="740" y="332" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" fill="#0E0E10">→ true</text>

  <text x="740" y="404" font-size="20" font-family="'Geist Mono', monospace" fill="#0E0E10">sato instanceof PremiumMember</text>
  <text x="740" y="436" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" fill="#0E0E10">→ false</text>

  <text x="600" y="560" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">PremiumMemberは必ずMemberでもある</text>
</svg>
</body>
</html>
