<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>バグに気づく場所が変わる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 336" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- lane labels -->
  <text x="80" y="232" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">OFF</text>
  <text x="80" y="368" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">ON</text>

  <!-- lane 1: OFF -->
  <line x1="464" y1="228" x2="500" y2="228" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="744" y1="228" x2="780" y2="228" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="176" width="240" height="104" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="340" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">nullが混入</text>
  <text x="340" y="256" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">コードを書く</text>

  <rect x="500" y="176" width="240" height="104" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="620" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">コンパイル</text>
  <text x="620" y="256" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">素通りする</text>

  <rect x="780" y="176" width="240" height="104" rx="12"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="900" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">実行時エラー</text>
  <text x="900" y="256" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">本番で発覚</text>

  <!-- lane 2: ON -->
  <line x1="464" y1="364" x2="500" y2="364" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="744" y1="364" x2="780" y2="364" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="312" width="240" height="104" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="340" y="360" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">nullが混入</text>
  <text x="340" y="392" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">コードを書く</text>

  <rect x="500" y="312" width="240" height="104" rx="12"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="620" y="360" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">コンパイルで検出</text>
  <text x="620" y="392" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">エラーで教える</text>

  <rect x="780" y="312" width="240" height="104" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="900" y="360" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">実行前に直せる</text>
  <text x="900" y="392" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">手元で解決</text>
</svg>
</body>
</html>
