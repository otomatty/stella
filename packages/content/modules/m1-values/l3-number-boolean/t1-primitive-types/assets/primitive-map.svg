<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 124 1200 436" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>

  <!-- Level 1: プリミティブ型 全体 -->
  <rect x="80" y="168" width="1040" height="280" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="104" y="156" width="112" height="24" fill="#FFFFFF"/>
  <text x="112" y="172" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">PRIMITIVE</text>

  <!-- Level 2: よく使う3つ -->
  <rect x="140" y="248" width="760" height="104" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="164" y="236" width="96" height="24" fill="#FFFFFF"/>
  <text x="172" y="252" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">CORE 3</text>

  <rect x="156" y="272" width="232" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="272" y="312" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">number</text>

  <rect x="404" y="272" width="232" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="520" y="312" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string</text>

  <rect x="652" y="272" width="232" height="64" rx="8" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="1.5"/>
  <text x="768" y="312" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">boolean</text>

  <text x="600" y="408" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">ほかに undefined / null / symbol / bigint もある</text>

  <text x="600" y="496" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">業務データの大半はこの3つの型で表せます</text>
</svg>