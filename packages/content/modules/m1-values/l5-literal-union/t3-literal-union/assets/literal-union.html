<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リテラルユニオン ― 決まった値だけを通す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 124 1200 516" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- Level 1: string型(すべての文字列) -->
  <rect x="200" y="168" width="800" height="320" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="224" y="156" width="100" height="24" fill="#FFFFFF"/>
  <text x="232" y="172" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">STRING</text>

  <!-- Level 2: リテラルユニオン型(stringの部分集合) -->
  <rect x="280" y="252" width="640" height="112" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="304" y="240" width="200" height="24" fill="#FFFFFF"/>
  <text x="312" y="256" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">LITERAL UNION</text>
  <text x="600" y="300" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">todo | doing | done</text>
  <text x="600" y="336" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">"done" は含まれる</text>

  <text x="600" y="440" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#8A8A93">"完了" は含まれない(stringのまま)</text>

  <text x="600" y="540" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">「状態は3種類だけ」という業務ルールをそのまま型にできます</text>
</svg>
</body>
</html>
