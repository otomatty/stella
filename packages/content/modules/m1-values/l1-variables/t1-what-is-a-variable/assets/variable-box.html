<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>変数は値に名前を付けた箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 124 1200 356" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- Level 1: 変数という箱 -->
  <rect x="360" y="168" width="480" height="272" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <rect x="384" y="156" width="88" height="24" fill="#FFFFFF"/>
  <text x="392" y="172" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">変数</text>

  <text x="600" y="224" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">userName</text>

  <!-- Level 2: 中に入っている値 -->
  <rect x="460" y="252" width="280" height="104" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <rect x="484" y="240" width="56" height="24" fill="#FFFFFF"/>
  <text x="492" y="256" font-size="16" font-weight="500" letter-spacing="0.18em"
        font-family="Figtree, sans-serif" fill="#8A8A93">値</text>
  <text x="600" y="312" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">"田中"</text>

  <text x="600" y="416" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">名前で何度でも呼び出せる</text>
</svg>
</body>
</html>
