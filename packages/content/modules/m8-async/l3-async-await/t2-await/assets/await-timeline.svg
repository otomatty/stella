<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 108 1200 452" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- レーン1: async関数の中 -->
  <text x="80" y="164" font-size="20" font-weight="700"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">async関数の中</text>

  <rect x="80" y="184" width="160" height="72" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="160" y="228" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">開始</text>

  <line x1="240" y1="220" x2="304" y2="220" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="304" y="184" width="220" height="72" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="416" y="228" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">wait(1000)を呼ぶ</text>

  <line x1="524" y1="220" x2="588" y2="220" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="588" y="184" width="280" height="72" rx="12" fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="728" y="228" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E62F9A">awaitで一時停止</text>

  <line x1="868" y1="220" x2="932" y2="220" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="932" y="184" width="160" height="72" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="1012" y="228" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">完了</text>

  <!-- レーン2: 関数の外 -->
  <text x="80" y="340" font-size="20" font-weight="700"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">関数の外</text>

  <rect x="80" y="364" width="1012" height="72" rx="12" fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="584" y="408" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">ほかの処理は動き続ける(画面は止まらない)</text>

  <text x="600" y="508" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">awaitが止めるのは、そのasync関数の中だけ</text>
</svg>