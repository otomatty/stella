<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>条件に合う要素だけを残す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 208 1200 272" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <line x1="288" y1="300" x2="352" y2="300" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="664" y2="300" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="252" width="208" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="184" y="288" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">在庫数の配列</text>
  <text x="184" y="324" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">5, 0, 12</text>

  <rect x="352" y="240" width="248" height="120" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="476" y="288" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">コールバック</text>
  <text x="476" y="320" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">stock =&gt; stock &gt; 0</text>

  <rect x="664" y="252" width="208" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="768" y="288" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">残った配列</text>
  <text x="768" y="324" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">5, 12</text>

  <text x="600" y="420" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">要素の数は減ることがある。中身そのものは変換されない</text>
</svg>
</body>
</html>
