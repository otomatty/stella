<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>集めるか、広げるか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- 見出し行 -->
  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="232" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">残余引数</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="232" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">スプレッド構文</text>

  <!-- 行1: どこに書くか -->
  <text x="352" y="344" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">どこに書く</text>
  <rect x="384" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">関数の定義側</text>
  <rect x="768" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="20"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">関数の呼び出し側</text>

  <!-- 行2: 何をするか -->
  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">何をする</text>
  <rect x="384" y="416" width="352" height="104" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="460" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">集める</text>
  <text x="560" y="496" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">80, 90, 70 → 配列</text>

  <rect x="768" y="416" width="352" height="104" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="944" y="460" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">広げる</text>
  <text x="944" y="496" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#5C5C66">配列 → 80, 90, 70</text>
</svg>
</body>
</html>
