<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 116 1200 364" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 呼び出し例(開始ノード) -->
  <rect x="60" y="184" width="280" height="72" rx="20" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="200" y="228" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">calcTax(1000)</text>

  <rect x="60" y="332" width="280" height="72" rx="20" fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="200" y="376" text-anchor="middle" font-size="24" font-family="'Geist Mono', monospace" fill="#0E0E10">calcTax()</text>

  <line x1="340" y1="220" x2="452" y2="248" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="368" x2="452" y2="280" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 判定(ダイヤモンド) -->
  <polygon points="600,192 728,268 600,344 472,268" fill="#FFFFFF" stroke="#0E0E10" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">型・個数は</text>
  <text x="600" y="288" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">正しい?</text>

  <line x1="728" y1="228" x2="836" y2="184" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792" y="192" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">正しい</text>

  <line x1="728" y1="308" x2="836" y2="352" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="792" y="352" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">誤り</text>

  <!-- 結果 -->
  <rect x="856" y="148" width="288" height="72" rx="12" fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="1000" y="192" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">実行できる</text>

  <rect x="856" y="316" width="288" height="72" rx="12" fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="1000" y="360" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">コンパイルエラー</text>

  <text x="600" y="440" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">個数の不一致も、実行前にエラーとして検出される</text>
</svg>