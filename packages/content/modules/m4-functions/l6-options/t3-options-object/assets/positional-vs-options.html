<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>位置で渡すか、名前で渡すか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 416" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- 見出し行 -->
  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">位置引数</text>
  <text x="560" y="252" text-anchor="middle" font-size="16" font-weight="400"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">順序で渡す</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">Options Object</text>
  <text x="944" y="252" text-anchor="middle" font-size="16" font-weight="400"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">名前で渡す</text>

  <!-- 行1: 呼び出し方 -->
  <text x="352" y="336" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">呼び出し方</text>
  <rect x="384" y="296" width="352" height="72" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="340" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#0E0E10">search("コーヒー", 10, true)</text>
  <rect x="768" y="296" width="352" height="72" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="340" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#0E0E10">search({ saleOnly: true })</text>

  <!-- 行2: 読みやすさ(差が出る行) -->
  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">読みやすさ</text>
  <rect x="384" y="416" width="352" height="104" rx="12"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="560" y="460" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">true が何の意味か</text>
  <text x="560" y="496" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">読めない</text>

  <rect x="768" y="416" width="352" height="104" rx="12"
        fill="rgba(22,163,74,0.08)" stroke="#16A34A" stroke-width="2"/>
  <text x="944" y="460" text-anchor="middle" font-size="24"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">saleOnly: true</text>
  <text x="944" y="496" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#16A34A">名前で明確</text>
</svg>
</body>
</html>
