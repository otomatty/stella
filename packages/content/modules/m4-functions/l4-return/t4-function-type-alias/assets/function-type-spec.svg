<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 144 1200 336" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>

  <!-- 連結線(親から2子への直角ルーティング) -->
  <line x1="600" y1="288" x2="600" y2="312" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="336" y1="312" x2="864" y2="312" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="336" y1="312" x2="336" y2="336" stroke="#B7B7BE" stroke-width="1.5"/>
  <line x1="864" y1="312" x2="864" y2="336" stroke="#B7B7BE" stroke-width="1.5"/>

  <!-- ルート: 型エイリアス(仕様) -->
  <rect x="380" y="176" width="440" height="112" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="224" text-anchor="middle" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">type PriceRule</text>
  <text x="600" y="256" text-anchor="middle" font-size="20" font-weight="400"
        font-family="'Geist Mono', monospace" fill="#5C5C66">(price: number) =&gt; number</text>

  <!-- 子: 実装1 -->
  <rect x="216" y="336" width="240" height="88" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="336" y="372" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">calcTax</text>
  <text x="336" y="400" text-anchor="middle" font-size="16" font-weight="400"
        font-family="'Geist Mono', monospace" fill="#5C5C66">price =&gt; price * 0.1</text>

  <!-- 子: 実装2 -->
  <rect x="744" y="336" width="240" height="88" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="864" y="372" text-anchor="middle" font-size="20" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#0E0E10">calcDiscount</text>
  <text x="864" y="400" text-anchor="middle" font-size="16" font-weight="400"
        font-family="'Geist Mono', monospace" fill="#5C5C66">price =&gt; price * 0.8</text>

  <text x="600" y="452" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">同じ型を満たす実装は何個でも作れる</text>
</svg>