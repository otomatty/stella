<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 136 1200 424" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 入り口: case "received" -->
  <rect x="300" y="168" width="320" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="460" y="204" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">case "received":</text>
  <text x="460" y="236" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">受付済みと表示</text>

  <!-- 本来の出口(break) : 実際には無い、幽霊ボックス -->
  <line x1="620" y1="212" x2="756" y2="212" stroke="#5C5C66" stroke-width="2"
        stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="688" y="196" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">break</text>

  <rect x="760" y="176" width="280" height="72" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="900" y="208" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">breakがあれば</text>
  <text x="900" y="232" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">ここで終了</text>

  <!-- 実際の流れ: breakがないので落ちていく -->
  <line x1="460" y1="256" x2="460" y2="316" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="288" text-anchor="end" font-size="16"
        font-family="'Geist Mono', monospace" fill="#5C5C66">breakなし</text>

  <rect x="300" y="316" width="320" height="104" rx="12"
        fill="rgba(229,52,43,0.08)" stroke="#E5342B" stroke-width="2"/>
  <text x="460" y="356" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">case "shipped":</text>
  <text x="460" y="392" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#E5342B">発送済みも表示される</text>

  <text x="460" y="456" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">shippedのbreakでようやく終了</text>
</svg>