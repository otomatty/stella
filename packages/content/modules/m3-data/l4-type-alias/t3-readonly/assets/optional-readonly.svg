<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 144 1200 496" width="1200" xmlns="http://www.w3.org/2000/svg"><defs><style>/*<![CDATA[*/@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');/*]]>*/</style></defs>

  <rect x="384" y="176" width="352" height="88" rx="12"
