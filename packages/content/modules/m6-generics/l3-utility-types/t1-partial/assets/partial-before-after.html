<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>元の型と、Partialを通した型の対比</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 496" width="1200" xmlns="http://www.w3.org/2000/svg">

  <!-- 列見出し -->
  <rect x="384" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="560" y="228" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">User</text>

  <rect x="768" y="176" width="352" height="88" rx="12"
        fill="#F7F7F9" stroke="#B7B7BE" stroke-width="2"/>
  <text x="944" y="228" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#0E0E10">Partial&lt;User&gt;</text>

  <!-- 行1: name -->
  <text x="352" y="344" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">name</text>
  <rect x="384" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">name: string</text>
  <rect x="768" y="296" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="352" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">name<tspan fill="#E62F9A">?</tspan>: string</text>

  <!-- 行2: age -->
  <text x="352" y="472" text-anchor="end" font-size="24" font-weight="600"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">age</text>
  <rect x="384" y="416" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="560" y="472" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">age: number</text>
  <rect x="768" y="416" width="352" height="88" rx="12"
        fill="#FFFFFF" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="944" y="472" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">age<tspan fill="#E62F9A">?</tspan>: number</text>

  <text x="600" y="580" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">プロパティは消えない。すべてに ? が付いて省略可能になる</text>
</svg>
</body>
</html>
