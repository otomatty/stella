<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>キーの型と値の型から対応表を作る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 152 1200 328" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 2つの入力 -->
  <rect x="80" y="184" width="256" height="88" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="208" y="220" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">キーの型 Status</text>
  <text x="208" y="252" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#0E0E10">"todo" | "done"</text>

  <rect x="80" y="308" width="256" height="72" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="208" y="340" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">値の型</text>
  <text x="208" y="368" text-anchor="middle" font-size="16"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string</text>

  <!-- Record -->
  <path d="M336 228 L456 272" stroke="#5C5C66" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M336 344 L456 300" stroke="#5C5C66" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="464" y="248" width="152" height="56" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="540" y="284" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#E62F9A">Record</text>

  <line x1="624" y1="276" x2="684" y2="276" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 結果 -->
  <rect x="692" y="184" width="352" height="196" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="868" y="220" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">対応表の型 Labels</text>
  <line x1="716" y1="236" x2="1020" y2="236" stroke="#DDDDE2" stroke-width="1.5"/>
  <text x="724" y="272" font-size="16" font-family="'Geist Mono', monospace" fill="#0E0E10">todo</text>
  <text x="1012" y="272" text-anchor="end" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">string</text>
  <text x="724" y="308" font-size="16" font-family="'Geist Mono', monospace" fill="#0E0E10">done</text>
  <text x="1012" y="308" text-anchor="end" font-size="16" font-family="'Geist Mono', monospace" fill="#5C5C66">string</text>
  <text x="868" y="352" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">キーが1つでも欠けると検出される</text>

  <text x="600" y="440" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1つ目の型引数がキー、2つ目が値の型になる</text>
</svg>
</body>
</html>
