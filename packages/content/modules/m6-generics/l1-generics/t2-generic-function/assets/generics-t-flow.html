<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>呼び出し時のTが、引数と戻り値の両方に届く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body { margin: 0; padding: 24px; background: #FFFFFF; }</style>
</head>
<body>
<svg viewBox="0 144 1200 496" width="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5C5C66"/>
    </marker>
  </defs>


  <!-- 呼び出し -->
  <rect x="424" y="176" width="352" height="72" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-size="24"
        font-family="'Geist Mono', monospace" fill="#0E0E10">wrap("コーヒー")</text>

  <line x1="600" y1="248" x2="600" y2="288" stroke="#5C5C66" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- T = string -->
  <rect x="464" y="296" width="272" height="72" rx="12"
        fill="rgba(230,47,154,0.08)" stroke="#E62F9A" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" font-size="24" font-weight="500"
        font-family="'Geist Mono', monospace" fill="#E62F9A">T = string</text>

  <!-- 分岐 -->
  <path d="M528 368 L296 456" stroke="#5C5C66" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M672 368 L904 456" stroke="#5C5C66" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="128" y="464" width="336" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="296" y="500" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">引数 value: T</text>
  <text x="296" y="536" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string</text>

  <rect x="736" y="464" width="336" height="96" rx="12"
        fill="#FFFFFF" stroke="#B7B7BE" stroke-width="2"/>
  <text x="904" y="500" text-anchor="middle" font-size="16" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">戻り値 T[]</text>
  <text x="904" y="536" text-anchor="middle" font-size="20"
        font-family="'Geist Mono', monospace" fill="#0E0E10">string[]</text>

  <text x="600" y="616" text-anchor="middle" font-size="20" font-weight="500"
        font-family="'Noto Sans JP', sans-serif" fill="#5C5C66">1回の呼び出しで決まったTが、Tを使うすべての場所に届く</text>
</svg>
</body>
</html>
