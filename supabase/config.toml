# FALCON INFORMAL — Supabase CLI 設定
# https://supabase.com/docs/guides/cli/config
#
# リモートプロジェクト: falcon-informal (ap-northeast-2)
# Dashboard: https://supabase.com/dashboard/project/jpanvybfaukpgqtwjljl

project_id = "jpanvybfaukpgqtwjljl"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
