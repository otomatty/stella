name: CI

# 検証ゲートの正本。 PR で直接動くほか、 deploy.yml / release-vscode.yml から
# `uses: ./.github/workflows/ci.yml` で呼ばれる。 ゲートを 3 つのワークフローに
# 書き写すと片方だけ直したときに黙って乖離するので、 定義はここ 1 か所だけに置く。
on:
  pull_request:
  workflow_call:
    inputs:
      scope:
        description: "full = 全ゲート + E2E / code = 型とテストだけ (.vsix を出す前の最小確認)"
        type: string
        default: full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR は後から来た push で前の実行を捨てて構わない。 main への push (deploy /
  # release から呼ばれる場合) は 1 本ずつ流し切る — 途中で切ると、 検証だけ通って
  # デプロイされない中途半端な実行が残る。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ジョブ名はブランチ保護の必須ステータスチェック名になるため、 ジョブ ID を
  # そのまま使う (`name:` を足さない)。 表示名を変えるとチェック名も変わり、
  # 保護ルールが「存在しないチェック待ち」で固まる。
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 名前と Git 内の設定だけを照合する。PR に秘密値を渡さず、fork でも走る。
      - name: Check deployment configuration
        run: bun run deploy:config:check

      - name: Check tutorial freshness
        continue-on-error: true
        run: bun run tutorials:check

      - name: Typecheck
        run: bun run typecheck

      # C# の課題 (dotnet-test) のテンプレートと見本を、本物の .NET SDK で動かして確かめる
      # (templates.test.ts・samples.test.ts。CI で dotnet が見つからないとテストが落ちる)。
      # 実行環境に入っている新しい SDK を使わないよう、別の場所に 10 系だけを入れる。
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.x

      # カバレッジは閾値を持たない (落とすためではなく、 手薄な場所を見えるように
      # するため)。 数字はジョブのサマリに出す。
      - name: Test
        run: bun run test:coverage

      # always() で走るので、 テストがカバレッジ生成前に落ちた場合もここへ来る。
      # その時にファイルを読みに行くと MODULE_NOT_FOUND で二度目の赤が出て、
      # 本当の失敗 (テスト) が埋もれる。 生成されている時だけ集計する。
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### カバレッジ"
            echo '```'
            if [ -f coverage/coverage-summary.json ]; then
              node -e '
                const s = require("./coverage/coverage-summary.json").total;
                for (const k of ["statements", "branches", "functions", "lines"])
                  console.log(`${k.padEnd(11)}: ${s[k].pct}% (${s[k].covered}/${s[k].total})`);
              '
            else
              echo "summary unavailable (テストがカバレッジ生成前に終了)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 以下は .vsix を出すだけの呼び出し (scope=code) では省く。
      - name: Lint
        if: inputs.scope != 'code'
        run: bun run lint

      # 通った課題の解答例・誤答の実行を飛ばす。鍵は実行ごとに違い、直前の保存を restore-keys で拾う。
      - name: Cache task checks
        if: inputs.scope != 'code'
        uses: actions/cache@v6
        with:
          path: .task-check-cache
          key: task-check-${{ github.run_id }}
          restore-keys: task-check-

      - name: Content vocabulary check
        env:
          CONTENT_REFERENCES_SUMMARY: ${{ runner.temp }}/source-references-summary.md
        if: inputs.scope != 'code'
        run: bun run content:check

      - name: Publish pending source approvals
        if: always() && inputs.scope != 'code'
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/source-references-summary.md" ]; then
            cat "$RUNNER_TEMP/source-references-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 図解 (SVG) のトークン検査。 content:check は Node だけで走る検査で打ち切る
      # ため、 これまで CI では一度も動いていなかった。 標準ライブラリだけで動く
      # ので runner の python3 をそのまま使う。
      - name: Diagram token lint
        if: inputs.scope != 'code'
        run: python3 .claude/skills/diagram-design/lint-skin.py packages/content/stages

      - name: Build
        if: inputs.scope != 'code'
        # Web の build plugin が全成果物 (遅延チャンク / public / worker / map)
        # の解答と private/ の混入を検査する (#35)。
        run: bun run build

  core-loop:
    if: inputs.scope != 'code'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # wrangler の対話プロンプト / テレメトリ送信を CI では無効にする。
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # wrangler dev はローカルモード (miniflare + ローカル D1) で動くため
      # Cloudflare の認証情報は不要。 OAuth も通さず JWT を直接発行する。
      # AUTH_JWT_SECRET は example に入っている開発用の値をそのまま使う
      # (API と スモークの双方がこの 1 ファイルから読むため値が一致する)。
      - name: Prepare .dev.vars
        run: cp apps/api/.dev.vars.example apps/api/.dev.vars

      - name: Migrate + seed local D1
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Start API (wrangler dev)
        run: |
          nohup bun run dev:api > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/healthz > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API が 60 秒以内に起動しませんでした"; cat /tmp/wrangler-dev.log; exit 1

      - name: Core loop smoke
        run: bun run smoke:core

      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/wrangler-dev.log

  e2e:
    if: inputs.scope != 'code' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ローカル D1 と API の準備は core-loop と合わせる。Web の preview 用に CORS を追加する。
      - name: Prepare .dev.vars
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          sed -i '/^ALLOWED_ORIGINS=/s/\r\?$/,http:\/\/127.0.0.1:4173,http:\/\/localhost:4173/' apps/api/.dev.vars

      - name: Migrate + seed local D1
        run: |
          bun run db:migrate
          bun run db:seed

      - name: Start API (wrangler dev)
        run: |
          nohup bun run dev:api > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/healthz > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API が 60 秒以内に起動しませんでした"; cat /tmp/wrangler-dev.log; exit 1

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Browser E2E
        run: bun run --filter=@stella/web e2e

      - name: List release screenshots
        id: shots
        if: ${{ !cancelled() }}
        run: |
          status=0
          for product in web vscode; do
            version=$(node -p "require('./apps/$product/package.json').version")
            if names=$(bun run --silent release:shots list --changelog "apps/$product/CHANGELOG.md" --version "$version"); then
              printf '%s=%s\n' "$product" "$names" >> "$GITHUB_OUTPUT"
            else
              status=1
            fi
          done
          exit "$status"

      - name: Capture Web release screenshots
        id: capture_web_shots
        if: ${{ !cancelled() && steps.shots.outputs.web != '' }}
        env:
          RELEASE_SHOTS: ${{ steps.shots.outputs.web }}
          RELEASE_SHOTS_OUT: ${{ runner.temp }}/release-shots/web
        # Browser E2E の失敗ログを Playwright の出力先の初期化から守る。
        run: bun run --filter=@stella/web release:shots --output "$RUNNER_TEMP/release-shots-web-test-results"

      - name: Capture VS Code release screenshots
        id: capture_vscode_shots
        if: ${{ !cancelled() && steps.shots.outputs.vscode != '' }}
        env:
          RELEASE_SHOTS: ${{ steps.shots.outputs.vscode }}
          RELEASE_SHOTS_OUT: ${{ runner.temp }}/release-shots/vscode
        run: bun run --filter=stella-lms release:shots

      - name: Upload release screenshots
        id: upload_shots
        if: ${{ !cancelled() && (steps.shots.outputs.web != '' || steps.shots.outputs.vscode != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-shots
          path: ${{ runner.temp }}/release-shots/
          if-no-files-found: ignore

      - name: Summarize release screenshots
        if: ${{ !cancelled() && (steps.shots.outputs.web != '' || steps.shots.outputs.vscode != '') }}
        env:
          WEB_SHOTS: ${{ steps.shots.outputs.web }}
          VSCODE_SHOTS: ${{ steps.shots.outputs.vscode }}
          WEB_CAPTURE: ${{ steps.capture_web_shots.outcome }}
          VSCODE_CAPTURE: ${{ steps.capture_vscode_shots.outcome }}
          ARTIFACT_ID: ${{ steps.upload_shots.outputs.artifact-id }}
        run: |
          summarize() {
            local product="$1" names="$2" capture="$3"
            if [[ -z "$names" ]]; then return; fi
            if [[ "$capture" == 'success' && -n "$ARTIFACT_ID" ]]; then
              printf 'リリースのお知らせのスクリーンショット: 成果物 `release-shots` に %s: %s を書き出しました\n\n' "$product" "$names"
            else
              printf 'リリースのお知らせのスクリーンショット: %s: %s の撮影または成果物のアップロードに失敗しました\n\n' "$product" "$names"
            fi
          }
          {
            summarize Web "$WEB_SHOTS" "$WEB_CAPTURE"
            summarize 'VS Code 拡張' "$VSCODE_SHOTS" "$VSCODE_CAPTURE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            apps/web/playwright-report/

      - name: Upload screenshot baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: apps/web/e2e/__screenshots__/
          if-no-files-found: ignore
