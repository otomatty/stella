name: Release VS Code Extension

# apps/vscode が main に入ったら .vsix をビルドして GitHub Releases に添付し、
# その版が Marketplace に無ければ Trusted Publishing（vsce --oidc）で公開する。
on:
  push:
    branches: [main]
    paths: ["apps/vscode/**"]
# workflow_dispatch は置かない。任意の ref から実行できてしまい、未マージのコードで
# vscode-v<version> の Release を作成/上書きできるため。再実行は Actions の Re-run で。

permissions:
  contents: write

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  # deploy.yml の検証ゲートは同じ push で並走するだけで、この job を止められない。
  # 壊れた main から .vsix が出ないよう、ここでも通す。 .vsix を出すのに要るのは
  # 型とテストなので scope=code で呼ぶ (lint / 教材検査 / E2E は deploy 側が見る)。
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      scope: code

  release:
    name: package .vsix → GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.create.outputs.created }}
      release_url: ${{ steps.meta.outputs.release_url }}
    steps:
      # ビルドと変更履歴の読み取りに同じコミットを使う。
      - uses: actions/checkout@v7

      # ワークスペースの依存関係とリリース用スクリプトを Bun で扱う。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ロックファイルの版でパッケージを再現する。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/vscode/package.json の package スクリプトは対話プロンプト
      # （repository フィールド欠落の確認）で CI が止まるため、
      # build + vsce を --allow-missing-repository 付きで直接呼ぶ。
      - name: Package
        working-directory: apps/vscode
        run: |
          bun run build
          bunx @vscode/vsce package --no-dependencies --allow-missing-repository --readme-path MARKETPLACE.md

      # 手動で採番した版からタグと通知に載せる URL を決める。
      - name: Read version
        id: meta
        run: |
          version=$(node -p "require('./apps/vscode/package.json').version")
          tag="vscode-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"

      # 同じ版の再 push で本文の手直しを失わないよう、先に Release の有無を確かめる。
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 同じ版の再ビルドは配布ファイルだけに反映する。
      - name: Replace the existing VSIX
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release upload "$TAG" apps/vscode/*.vsix --clobber

      # 初回だけ本文と通知に使う要約を用意する。
      - name: Prepare release notes
        if: steps.release.outputs.exists == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bun run release:notes prepare --product vscode --version "$VERSION" \
            --changelog apps/vscode/CHANGELOG.md --commit "$GITHUB_SHA" --out-dir "$RUNNER_TEMP/release"

      # ビルドしたコミットからタグを切り、本文と VSIX を公開する。
      - name: Create release
        id: create
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" apps/vscode/*.vsix --target "$GITHUB_SHA" \
            --title "VS Code 拡張 $TAG" --notes-file "$RUNNER_TEMP/release/release-body.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Marketplace 公開後の通知でも、本文と同じ要約を使う。
      - name: Save release summary
        if: steps.create.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-summary
          path: ${{ runner.temp }}/release/release-summary.json
          if-no-files-found: error

  # 公開だけが OIDC トークンを要求できる。bun install や build と同じジョブに置くと、
  # それらの処理からも Trusted Publishing のトークンを取れてしまう。
  publish:
    name: publish to Marketplace
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # vsce を Bun から起動する。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Release に付いた VSIX だけを取る。リポジトリのビルドは走らせない。
      # 同じ版は Marketplace が拒否する。--skip-duplicate は既掲載なら成功で戻る。
      # 公開できるのは、publisher saedgewell の Trusted Publishing に
      # otomatty / stella / release-vscode.yml（environment なし）が登録されているとき。
      - name: Download the release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release download "vscode-v${VERSION}" --pattern "stella-lms-*.vsix" --dir vsix

      # 公開済みの版を飛ばし、同じ版の再 push でも手順を再実行できるようにする。
      - name: Publish to Marketplace
        working-directory: vsix
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bunx @vscode/vsce@4.1.0 publish --oidc --packagePath "stella-lms-${VERSION}.vsix" --skip-duplicate

  # 受講者が Marketplace から入れられるようになってから、新しい Release を知らせる。
  announce:
    needs: [release, publish]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 通知用スクリプトを実行するコミットを取得する。
      - uses: actions/checkout@v7

      # リリース用スクリプトは Bun で動かす。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 通知用スクリプトの依存関係をロックファイルから揃える。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Release を作ったときの要約を引き継ぐ。
      - name: Download release summary
        uses: actions/download-artifact@v7
        with:
          name: release-summary
          path: ${{ runner.temp }}/release

      # Google Chat の障害で公開済みのリリースを失敗扱いにしない。
      - name: Notify Google Chat
        continue-on-error: true
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          RELEASE_URL: ${{ needs.release.outputs.release_url }}
        run: |
          bun run release:notes notify --summary "$RUNNER_TEMP/release/release-summary.json" \
            --release-url "$RELEASE_URL"
