name: Release VS Code Extension

# apps/vscode が main に入ったら .vsix をビルドして GitHub Releases に添付し、
# その版が Marketplace に無ければ Trusted Publishing（vsce --oidc）で公開する。
on:
  push:
    branches: [main]
    paths: ["apps/vscode/**"]
# workflow_dispatch は置かない。任意の ref から実行できてしまい、未マージのコードで
# vscode-v<version> の Release を作成/上書きできるため。再実行は Actions の Re-run で。

permissions:
  contents: write

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  # deploy.yml の検証ゲートは同じ push で並走するだけで、この job を止められない。
  # 壊れた main から .vsix が出ないよう、ここでも通す。 .vsix を出すのに要るのは
  # 型とテストなので scope=code で呼ぶ (lint / 教材検査 / E2E は deploy 側が見る)。
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      scope: code

  release:
    name: package .vsix → GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/vscode/package.json の package スクリプトは対話プロンプト
      # （repository フィールド欠落の確認）で CI が止まるため、
      # build + vsce を --allow-missing-repository 付きで直接呼ぶ。
      - name: Package
        working-directory: apps/vscode
        run: |
          bun run build
          bunx @vscode/vsce package --no-dependencies --allow-missing-repository --readme-path MARKETPLACE.md

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./apps/vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      # 同一バージョンで再度 main に push された場合は既存 Release に上書き添付する
      # （バージョン採番は apps/vscode/package.json の手動更新。自動 bump はしない）。
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: vscode-v${{ steps.meta.outputs.version }}
          NOTES: |
            commit ${{ github.sha }} からビルド。
            .vsix をダウンロードし、VS Code の「Extensions: Install from VSIX...」でインストールする。
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # .vsix と本文をセットで差し替える（本文の commit がビルド元）。
            # タグ自体は初回リリース時のコミットを指したままなので、
            # コミットとタグを一致させたい場合はバージョンを上げること。
            gh release upload "$TAG" apps/vscode/*.vsix --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            # タグ未作成時の gh release create はデフォルトブランチの最新から
            # タグを切るため、ビルドした commit を --target で明示する。
            gh release create "$TAG" apps/vscode/*.vsix \
              --target "$GITHUB_SHA" \
              --title "VS Code 拡張 $TAG" \
              --notes "$NOTES"
          fi

  # 公開だけが OIDC トークンを要求できる。bun install や build と同じジョブに置くと、
  # それらの処理からも Trusted Publishing のトークンを取れてしまう。
  publish:
    name: publish to Marketplace
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Release に付いた VSIX だけを取る。リポジトリのビルドは走らせない。
      # 同じ版は Marketplace が拒否する。--skip-duplicate は既掲載なら成功で戻る。
      # 公開できるのは、publisher saedgewell の Trusted Publishing に
      # otomatty / stella / release-vscode.yml（environment なし）が登録されているとき。
      - name: Download the release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "vscode-v${{ needs.release.outputs.version }}" --pattern "stella-lms-*.vsix" --dir vsix

      - name: Publish to Marketplace
        working-directory: vsix
        run: bunx @vscode/vsce publish --oidc --packagePath "stella-lms-${{ needs.release.outputs.version }}.vsix" --skip-duplicate
