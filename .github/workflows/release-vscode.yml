name: Release VS Code Extension

# apps/vscode が main に入ったら .vsix をビルドして GitHub Releases に添付し、
# その版が Marketplace に無ければ Trusted Publishing（vsce --oidc）で公開する。
on:
  push:
    branches: [main]
    paths: ["apps/vscode/**"]
# workflow_dispatch は置かない。任意の ref から実行できてしまい、未マージのコードで
# vscode-v<version> の Release を作成/上書きできるため。再実行は Actions の Re-run で。

permissions:
  contents: write

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  # deploy.yml の検証ゲートは同じ push で並走するだけで、この job を止められない。
  # 壊れた main から .vsix が出ないよう、ここでも通す。 .vsix を出すのに要るのは
  # 型とテストなので scope=code で呼ぶ (lint / 教材検査 / E2E は deploy 側が見る)。
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      scope: code

  release:
    name: package .vsix → GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      queue: ${{ steps.announcement.outputs.queue }}
    steps:
      # ビルドと変更履歴の読み取りに同じコミットを使う。
      - uses: actions/checkout@v7

      # ワークスペースの依存関係とリリース用スクリプトを Bun で扱う。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ロックファイルの版でパッケージを再現する。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/vscode/package.json の package スクリプトは対話プロンプト
      # （repository フィールド欠落の確認）で CI が止まるため、
      # build + vsce を --allow-missing-repository 付きで直接呼ぶ。
      - name: Package
        working-directory: apps/vscode
        run: |
          bun run build
          bunx @vscode/vsce package --no-dependencies --allow-missing-repository --readme-path MARKETPLACE.md

      # 手動で採番した版からタグを決める。
      - name: Read version
        id: meta
        run: |
          version=$(node -p "require('./apps/vscode/package.json').version")
          tag="vscode-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 同じ版の再 push で本文の手直しを失わないよう、先に Release の有無を確かめる。
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List release screenshots
        id: shots
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          names=$(bun run --silent release:shots list --changelog apps/vscode/CHANGELOG.md --version "$VERSION")
          printf 'names=%s\n' "$names" >> "$GITHUB_OUTPUT"

      - name: Install Japanese fonts and Chromium for release screenshots
        id: shots_browser
        if: steps.shots.outputs.names != ''
        continue-on-error: true
        working-directory: apps/vscode
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          bunx playwright install --with-deps chromium

      - name: Capture release screenshots
        id: capture_shots
        if: steps.shots_browser.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_SHOTS: ${{ steps.shots.outputs.names }}
          RELEASE_SHOTS_OUT: ${{ runner.temp }}/release-shots
        run: bun run --filter=stella-lms release:shots

      - name: Upload release screenshots to R2
        id: upload_shots
        if: steps.capture_shots.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MATERIALS_BASE_URL: ${{ vars.VITE_MATERIALS_BASE_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          bun run release:shots upload --product vscode --version "$VERSION" \
            --dir "$RUNNER_TEMP/release-shots" --out "$RUNNER_TEMP/release/images.json"

      # 同じ版の再ビルドは配布ファイルだけに反映する。
      - name: Replace the existing VSIX
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "apps/vscode/stella-lms-${VERSION}.vsix#stella-lms-${VERSION}.vsix（commit ${GITHUB_SHA::7}）" \
            --clobber

      # 初回だけ本文と通知に使う要約を用意する。
      - name: Prepare release notes
        if: steps.release.outputs.exists == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          SCREENSHOT_UPLOAD: ${{ steps.upload_shots.outcome }}
        run: |
          images=()
          if [[ "$SCREENSHOT_UPLOAD" == 'success' && -f "$RUNNER_TEMP/release/images.json" ]]; then
            images=(--images "$RUNNER_TEMP/release/images.json")
          fi
          bun run release:notes prepare --product vscode --version "$VERSION" \
            --changelog apps/vscode/CHANGELOG.md --commit "$GITHUB_SHA" --out-dir "$RUNNER_TEMP/release" "${images[@]}"

      # 本文と VSIX を公開し、Marketplace 公開前の要約も同時に添付する。
      - name: Create release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/release/release-summary.json" "$RUNNER_TEMP/release/release-summary.pending.json"
          gh release create "$TAG" \
            "apps/vscode/stella-lms-${VERSION}.vsix#stella-lms-${VERSION}.vsix（commit ${GITHUB_SHA::7}）" \
            "$RUNNER_TEMP/release/release-summary.pending.json" --target "$GITHUB_SHA" \
            --title "VS Code 拡張 $TAG" --notes-file "$RUNNER_TEMP/release/release-body.md"

      # 再実行は Release の添付から再開する。0.10.1 以前には pending がなく、通知の対象外。
      - name: Check whether to queue the announcement
        id: announcement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          if [[ "$RELEASE_EXISTS" == 'false' ]]; then
            echo "queue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -Fxq 'release-summary.pending.json' <<< "$assets" &&
            ! grep -Fxq 'release-summary.json' <<< "$assets" &&
            ! grep -Fxq 'release-announced.json' <<< "$assets"; then
            echo "queue=true" >> "$GITHUB_OUTPUT"
          else
            echo "queue=false" >> "$GITHUB_OUTPUT"
          fi

  # 公開だけが OIDC トークンを要求できる。bun install や build と同じジョブに置くと、
  # それらの処理からも Trusted Publishing のトークンを取れてしまう。
  publish:
    name: publish to Marketplace
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # vsce を Bun から起動する。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Release に付いた VSIX だけを取る。リポジトリのビルドは走らせない。
      # 同じ版は Marketplace が拒否する。--skip-duplicate は既掲載なら成功で戻る。
      # 公開できるのは、publisher saedgewell の Trusted Publishing に
      # otomatty / stella / release-vscode.yml（environment なし）が登録されているとき。
      - name: Download the release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release download "vscode-v${VERSION}" --pattern "stella-lms-*.vsix" --dir vsix

      # 公開済みの版を飛ばし、同じ版の再 push でも手順を再実行できるようにする。
      - name: Publish to Marketplace
        working-directory: vsix
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: bunx @vscode/vsce@4.1.0 publish --oidc --packagePath "stella-lms-${VERSION}.vsix" --skip-duplicate

  # Marketplace に公開できた版だけを翌朝のお知らせに載せる。
  queue-announcement:
    needs: [release, publish]
    if: needs.release.outputs.queue == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Attach release summary
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="vscode-v${VERSION}"
          dir="$RUNNER_TEMP/release"
          gh release download "$tag" --pattern release-summary.pending.json --dir "$dir"
          mv "$dir/release-summary.pending.json" "$dir/release-summary.json"
          gh release upload "$tag" "$dir/release-summary.json" --clobber
