name: Lesson videos

# 教材動画は deploy では作らない。main で手動実行する。
# concurrency は deploy.yml の deploy-main と分ける。GitHub Actions は
# cancel-in-progress: false でも、同じグループの待機中の実行を 1 つしか残さず、
# あとから来た実行が待機中の実行を取り消す。グループを共有すると、デプロイの
# 実行中に動画を始めると待機中のデプロイが取り消される (またはその逆)。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: ステージの slug。空なら全ステージ
        required: false
        default: ""
        type: string
      topics:
        description: トピック ID をカンマ区切り (例 1-1-9,1-2-3)。stage と併用できる
        required: false
        default: ""
        type: string
      force:
        description: topics を指定したときだけ、台帳にあっても作り直す
        required: false
        default: false
        type: boolean
      dry_run:
        description: 対象と必要な TTS の回数・残りを出すだけで、R2 と D1 に書かない
        required: false
        default: false
        type: boolean

concurrency:
  # deploy-main とは分ける。同じグループだと、待機中の実行は 1 つしか残らない。
  group: lesson-videos
  cancel-in-progress: false

jobs:
  videos:
    name: generate → upload → seed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      VITE_MATERIALS_BASE_URL: ${{ vars.VITE_MATERIALS_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve deployment database and validate URLs
        run: bun run deploy:prepare
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: bunx --bun playwright install --with-deps chromium
        working-directory: packages/content

      # 場面ごとの音声と映像は内容ハッシュで再利用する。毎回新しいキーで保存し、
      # 次の実行は直近のキャッシュを復元する。30日使わないファイルは sync が消す。
      # 上限超えと dry_run では消さない。
      - name: Cache lesson video scenes and audio
        uses: actions/cache@v6
        with:
          path: packages/content/dist/video-cache
          key: video-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: video-cache-${{ runner.os }}-

      # 一部失敗でも manifest があれば seed する。ジョブの成否は最後の step で戻す。
      # 回数の表は video:sync が GITHUB_STEP_SUMMARY に書く。
      - name: Generate & upload lesson videos to R2 (remote)
        id: video
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TTS_DAILY_LIMIT: ${{ vars.VIDEO_TTS_DAILY_LIMIT }}
          STAGE: ${{ inputs.stage }}
          TOPICS: ${{ inputs.topics }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY が無いので動画を作れません"
            exit 1
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          args=(--remote --tts gemini)
          if [ -n "${STAGE}" ]; then
            args+=("${STAGE}")
          fi
          if [ -n "${TOPICS}" ]; then
            args+=(--topics "${TOPICS}")
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          status=0
          bun run --filter=@stella/content video:sync -- "${args[@]}" || status=$?
          if [ -f packages/content/dist/video-manifest.json ]; then
            echo "manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      # seed は教材全体を書く。グループを deploy と分けたので、この checkout の
      # あとに main が進んでいると、古い教材で新しいデプロイを上書きする。
      # チェックアウトした commit が origin/main の先頭と同じときだけ seed する。
      # 違えば seed を飛ばして失敗する。作った動画は台帳にあるので、もう一度
      # 実行すれば読み上げを使わずに登録だけを行う。同じ commit のデプロイと
      # 同時に走るのは、同じ内容を書くので許す。git ls-remote は checkout の
      # 認証のまま使い、追加の権限は要らない。
      - name: Seed D1 content (remote)
        if: steps.video.outputs.manifest == 'true'
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk 'NR==1 { print $1 }')"
          if [ -z "${remote}" ]; then
            echo "origin/main の先頭を読めなかったので、動画の登録を飛ばしました"
            echo "checkout=${checkout}"
            exit 1
          fi
          if [ "${checkout}" != "${remote}" ]; then
            echo "main が進んだので動画の登録を飛ばしました。作った動画は台帳にあるので、もう一度実行すれば読み上げを使わずに登録だけを行います"
            echo "checkout=${checkout}"
            echo "origin/main=${remote}"
            exit 1
          fi
          bun run db:seed:remote:content
        env:
          VIDEO_MANIFEST: ${{ github.workspace }}/packages/content/dist/video-manifest.json

      - name: Fail when video generation failed
        if: steps.video.outcome == 'failure'
        run: exit 1
