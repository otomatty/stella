name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 検証ゲートは ci.yml が正本。 ここに書き写すと片方だけ直したときに乖離するため
  # 呼ぶだけにする。 E2E (core-loop) もこの呼び出しに含まれるので、 main の
  # 組み合わせで一度も E2E を通さないままデプロイする、 という穴が塞がる。
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: assets → migrate → api → web → seed → narrator
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      VITE_MATERIALS_BASE_URL: ${{ vars.VITE_MATERIALS_BASE_URL }}
      # 認証は Clerk、講師・管理者用の入口は Cloudflare Access (docs/clerk-auth.md)。deploy:prepare が
      # 確かめて API の [vars] に書き、無ければ Cloudflare に何も書かないうちにデプロイを止める。
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_STAFF_ORIGIN: ${{ vars.VITE_STAFF_ORIGIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 新名の D1 を検索し、この checkout の binding を実 ID に揃える。
      # 教材の指紋・seed・migration・API は全てこの設定を読む。未準備なら書き込み前に停止。
      - name: Resolve deployment database and validate URLs
        run: bun run deploy:prepare
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 教材パイプライン (R2 画像 → PDF → seed) を流す必要があるかを先に決める。
      # 判定は seed・PDF・画像の生成が読むファイルの内容指紋
      # (content-fingerprint.ts の SEED_INPUT_PATHS。教材の正本・旧演習・
      # migration と、生成コードの値 import) と、前回 seed まで通ったときに
      # R2 へ記録した指紋の比較。型だけの変更や API の実装では流さない。
      # コミット間の diff ではなく内容そのものを見るので、前回が seed の手前で
      # 落ちていた場合や Re-run / force push のあとでも「まだ入っていない教材を
      # 飛ばす」は起きない。
      # PDF_KEY_SALT は PDF の R2 キーに入るので、塩を替えた push は教材が同じでも
      # PDF と seed をやり直す必要がある。指紋にも混ぜる (記録に残るのは指紋だけ)。
      - name: Check whether course content changed
        id: content
        run: bun run content:state:check:remote
        env:
          PDF_KEY_SALT: ${{ secrets.PDF_KEY_SALT }}

      # --- デプロイ（直列。前段失敗で後段は動かない） ---
      #
      # D1 スキーマに触れる 2 ステップ (migrate → seed) の間に、旧スキーマ前提の
      # 稼働中 Worker が新スキーマを読む時間ができる。後方非互換な migration では
      # そこが障害の窓になるので、時間の読めない R2 アップロード / PDF 生成を先に
      # 済ませ、migrate → deploy:api → seed を隙間なく並べて窓を最小化する。
      #
      # 教材画像 (図解 SVG + 講座サムネイル) を seed より先に R2 へ置く。
      # 順序が逆だと、D1 がまだ存在しないオブジェクトを指す時間ができる。
      # put は冪等なので、走るときは毎回全件流す (Cloudflare API 直叩きなので
      # 126 件でも十数秒。 CLI を 1 ファイル 1 回起こしていた頃は 2 分半だった)。
      # CLOUDFLARE_API_TOKEN には「Workers R2 Storage: Edit」権限が要る。
      - name: Upload course materials (figures + thumbnails) to R2 (remote)
        if: steps.content.outputs.changed == 'true'
        run: bun run content:upload:remote

      # 教材 PDF (配布資料) の差分生成 + R2 アップロード。R2 上の台帳
      # (lesson-pdf/state.json — put 済みキーの記録) と突き合わせ、変わった教材だけ
      # Playwright で PDF 化して put する。seed より先に流すのは図解・サムネイルと
      # 同じ理由 (D1 が存在しないオブジェクトを指す時間を作らない)。マニフェストは
      # 次の seed が PDF_MANIFEST で読む。
      #
      # ブラウザは ~/.cache/ms-playwright に入る。 キャッシュのキーは
      # packages/content の playwright のバージョン (bun.lock) で、 上がった日だけ
      # 落とし直す。 OS 依存パッケージ (--with-deps) はキャッシュに載らないので
      # install 自体は毎回呼ぶ (ブラウザ本体がキャッシュにあれば数秒で終わる)。
      - name: Cache Playwright browsers
        if: steps.content.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.content.outputs.changed == 'true'
        run: bunx --bun playwright install --with-deps chromium
        working-directory: packages/content
      # PDF_KEY_SALT (任意の長いランダム文字列を repo Secrets に登録) を設定すると
      # R2 キーのハッシュが HMAC になり、リポジトリ内容からキーを計算できなくなる
      # (公開バケット直リンクの緩和)。未設定でも動くが、キーは内容から計算可能。
      # 途中で変えると全キーが変わり、次のデプロイで全教材が新版として作り直される。
      - name: Generate & upload lesson PDFs to R2 (remote)
        if: steps.content.outputs.changed == 'true'
        run: bun run content:pdf:sync:remote
        env:
          PDF_KEY_SALT: ${{ secrets.PDF_KEY_SALT }}

      # migrate / api / web は教材が変わっていなくても毎回。 migration が
      # 「何もしない」判断は今どおり wrangler に任せる。
      - name: Apply D1 migrations (remote)
        run: bun run db:migrate:remote

      # Fixed private bucket only; stop deployment if any public domain is enabled.
      - name: Prepare private library storage
        run: bun run apps/api/scripts/prepare-library-storage.ts

      # 検証ゲート (verify ジョブ) の dist は使えない。 VITE_SERVER_URL /
      # VITE_MATERIALS_BASE_URL はビルド時に焼き込むので、 それを持たない
      # verify 側の成果物は本番向けではないため。 ここで web だけ建て直す
      # (vscode 拡張は web のデプロイに要らない)。
      #
      # ビルドは API のデプロイより前に済ませ、API と Web のデプロイを隙間なく並べる。
      # API は Web の Worker の中継 (サービスバインディング) でしか受けないので
      # (workers_dev = false)、API だけが新しく Web が古い時間は画面が API に届かない。
      # その時間を数秒にし、seed (時間が読めず落ちることもある) を挟まない。
      - name: Build Web (VITE_* baked in)
        run: bun run --filter=@stella/web build

      # Clerk のシークレットキーは repo Secrets から API の secret に入れる (deploy:prepare が形を確かめた)。
      # 無いと API がログインを確かめられず全員 503 になるので、API のデプロイの前に揃える。
      - name: Sync Clerk secret key to the API
        working-directory: apps/api
        run: printf '%s' "$CLERK_SECRET_KEY" | bunx wrangler secret put CLERK_SECRET_KEY
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Sync AI review secret key to the API
        working-directory: apps/api
        run: printf '%s' "$ANTHROPIC_API_KEY" | bunx wrangler secret put ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Deploy API
        run: bun run deploy:api

      - name: Deploy Web
        run: bun run --filter=@stella/web deploy

      # 同じ成果物を講師・管理者用の入口 (stella-admin、Access で守る) としても配る。
      - name: Deploy Web (staff host)
        run: bun run --filter=@stella/web deploy:admin

      # seed は D1 の HTTP API へ直接書く (Worker を経由しない) ので、deploy:api /
      # Web の後でも成立する。PDF sync が出した PDF_MANIFEST を読む。
      - name: Seed D1 content (remote)
        if: steps.content.outputs.changed == 'true'
        run: bun run db:seed:remote:content
        env:
          PDF_MANIFEST: ${{ github.workspace }}/packages/content/dist/pdf-manifest.json

      # 指紋の記録は R2・PDF・seed が全部通ってから。 途中で落ちた回は記録されない
      # ので、 次の push が (教材が変わっていなくても) もう一度フルで流す。
      #
      # ここだけ continue-on-error。 記録に失敗しても本番の状態は正しく、 起きるのは
      # 「次のデプロイが教材パイプラインをもう一度流す」だけ。 それで web のデプロイを
      # 止める方が損。
      - name: Record course content fingerprint
        if: steps.content.outputs.changed == 'true'
        continue-on-error: true
        run: bun run content:state:save:remote
        env:
          PDF_KEY_SALT: ${{ secrets.PDF_KEY_SALT }}

      # Last, and never tolerated: narrator carries the processing switch, so a failed deploy
      # (including one that turns processing off) must fail the run instead of leaving the
      # previous version running. API and both web hosts are already out, so they are never blocked, and
      # the API's checks (e.g. the external-processing confirmation) ship before narrator's
      # settings. The API's NARRATOR binding needs stella-narrator to exist: on a brand-new
      # account, run `bun run deploy:narrator` once before the first deploy.
      - name: Deploy narrator (private service)
        run: bun run deploy:narrator

      # Web の中継と narrator の最新版が揃った直後に、秘密値を含まない状態だけを照合する。
      - name: Verify production configuration
        run: bun run deploy:health:check
