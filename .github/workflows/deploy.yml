name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # 検証ゲートは ci.yml が正本。 ここに書き写すと片方だけ直したときに乖離するため
  # 呼ぶだけにする。 E2E (core-loop) もこの呼び出しに含まれるので、 main の
  # 組み合わせで一度も E2E を通さないままデプロイする、 という穴が塞がる。
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: assets → migrate → api → seed → web
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      VITE_MATERIALS_BASE_URL: ${{ vars.VITE_MATERIALS_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 新名の D1 を検索し、この checkout の binding を実 ID に揃える。
      # 教材の指紋・seed・migration・API は全てこの設定を読む。未準備なら書き込み前に停止。
      - name: Resolve deployment database and validate URLs
        run: bun run deploy:prepare
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # 教材パイプライン (R2 画像 → seed) を流す必要があるかを先に決める。
      # 動画は手元で生成し、register-lesson-videos.ts で登録する。
      # 判定は seed・画像・動画の生成が読むファイルの内容指紋
      # (content-fingerprint.ts の SEED_INPUT_PATHS。教材の正本・旧演習・
      # migration と、生成コードの値 import) と、前回 seed まで通ったときに
      # R2 へ記録した指紋の比較。型だけの変更や API の実装では流さない。
      # コミット間の diff ではなく内容そのものを見るので、前回が seed の手前で
      # 落ちていた場合や Re-run / force push のあとでも「まだ入っていない教材を
      # 飛ばす」は起きない。
      - name: Check whether course content changed
        id: content
        run: bun run content:state:check:remote

      # 教材の更新中は手元の register-lesson-videos.ts が前回の指紋で登録できないようにする。
      # seed まで通れば下のステップで新しい指紋を記録する。
      - name: Clear previous course content fingerprint
        if: steps.content.outputs.changed == 'true'
        run: bun run content:state:reset:remote

      # --- デプロイ（直列。前段失敗で後段は動かない） ---
      #
      # D1 スキーマに触れる 2 ステップ (migrate → seed) の間に、旧スキーマ前提の
      # 稼働中 Worker が新スキーマを読む時間ができる。後方非互換な migration では
      # そこが障害の窓になるので、時間の読めない R2 アップロードを先に
      # 済ませ、migrate → deploy:api → seed を隙間なく並べて窓を最小化する。
      #
      # 教材画像 (図解 SVG + 講座サムネイル) を seed より先に R2 へ置く。
      # 順序が逆だと、D1 がまだ存在しないオブジェクトを指す時間ができる。
      # put は冪等なので、走るときは毎回全件流す (Cloudflare API 直叩きなので
      # 126 件でも十数秒。 CLI を 1 ファイル 1 回起こしていた頃は 2 分半だった)。
      # CLOUDFLARE_API_TOKEN には「Workers R2 Storage: Edit」権限が要る。
      - name: Upload course materials (figures + thumbnails) to R2 (remote)
        if: steps.content.outputs.changed == 'true'
        run: bun run content:upload:remote

      # 配布 PDF の lesson-pdf/ を 1 日で消す予約。失敗したら migration は走らない。
      - name: Retire lesson PDF storage
        run: bun run apps/api/scripts/retire-lesson-pdfs.ts

      # migrate / api / web は教材が変わっていなくても毎回。 migration が
      # 「何もしない」判断は今どおり wrangler に任せる。
      - name: Apply D1 migrations (remote)
        run: bun run db:migrate:remote

      # 動画・字幕・表紙を crossOrigin で読むため、教材の変更にかかわらず毎回 CORS を設定する。
      - name: Allow the web to load course materials (R2 CORS)
        run: bun run apps/api/scripts/prepare-materials-cors.ts

      # ログイン (Better Auth) の署名鍵。無いと API がログインを受け付けないので API のデプロイの前に揃える。
      - name: Sync login signing secret to the API
        working-directory: apps/api
        run: printf '%s' "$BETTER_AUTH_SECRET" | bunx wrangler secret put BETTER_AUTH_SECRET
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Sync AI review secret key to the API
        working-directory: apps/api
        run: printf '%s' "$ANTHROPIC_API_KEY" | bunx wrangler secret put ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Sync optional OpenAI key to the API
        working-directory: apps/api
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | bunx wrangler secret put OPENAI_API_KEY
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy API
        run: bun run deploy:api

      # seed は D1 の HTTP API へ直接書く (Worker を経由しない) ので、deploy:api の
      # 後でも成立する。VIDEO_MANIFEST は渡さないので、
      # 既存の lessons.video_path はそのまま残る。
      - name: Seed D1 content (remote)
        if: steps.content.outputs.changed == 'true'
        run: bun run db:seed:remote:content

      # 指紋の記録は R2 画像・seed が全部通ってから。 途中で落ちた回は記録されない
      # ので、 次の push が (教材が変わっていなくても) もう一度フルで流す。
      # 動画はこのワークフローでは作らない。
      #
      # 記録も continue-on-error。 記録に失敗しても本番の状態は正しく、 起きるのは
      # 「次のデプロイが教材パイプラインをもう一度流す」だけ。 それで web のデプロイを
      # 止める方が損。
      - name: Record course content fingerprint
        if: steps.content.outputs.changed == 'true'
        continue-on-error: true
        run: bun run content:state:save:remote

      # 検証ゲート (verify ジョブ) の dist は使えない。 VITE_SERVER_URL /
      # VITE_MATERIALS_BASE_URL はビルド時に焼き込むので、 それを持たない
      # verify 側の成果物は本番向けではないため。 ここで web だけ建て直す
      # (vscode 拡張は web のデプロイに要らない)。
      - name: Deploy Web (build with VITE_* then deploy)
        run: bun run deploy:web

      # Web の中継が最新版になった直後に、秘密値を含まない状態だけを照合する。
      - name: Verify production configuration
        run: bun run deploy:health:check

      # 本棚のデータの片付け (2026-11)。バケットが消えたら、この step とスクリプトは消してよい
      - name: Retire personal library storage
        continue-on-error: true
        run: bun run apps/api/scripts/retire-library-storage.ts

  # 本番反映と health check が通ってから Web の Release を作る。
  release-web:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 本番へ反映したコミットの変更履歴を使う。
      - uses: actions/checkout@v7

      # リリース用スクリプトは Bun で動かす。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # リリース用スクリプトの依存関係をロックファイルから揃える。
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # package.json の version を手で上げたときだけ、新しいタグになる。
      - name: Read Web version
        id: meta
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=web-v$version" >> "$GITHUB_OUTPUT"

      # 同じ版のデプロイでは Release の作成を省く。
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "この版の Release は作成済み"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List release screenshots
        id: shots
        if: steps.release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          names=$(bun run --silent release:shots list --changelog apps/web/CHANGELOG.md --version "$VERSION")
          printf 'names=%s\n' "$names" >> "$GITHUB_OUTPUT"

      - name: Prepare local API for release screenshots
        id: shots_api
        if: steps.shots.outputs.names != ''
        continue-on-error: true
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          sed -i '/^ALLOWED_ORIGINS=/s/\r\?$/,http:\/\/127.0.0.1:4173,http:\/\/localhost:4173/' apps/api/.dev.vars
          bun run db:migrate
          bun run db:seed
          nohup bun run dev:api > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/healthz > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API が 60 秒以内に起動しませんでした"; cat "$RUNNER_TEMP/wrangler-dev.log"; exit 1

      - name: Install Japanese fonts and Chromium for release screenshots
        id: shots_browser
        if: steps.shots_api.outcome == 'success'
        continue-on-error: true
        working-directory: apps/web
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          bunx playwright install --with-deps chromium

      - name: Capture release screenshots
        id: capture_shots
        if: steps.shots_browser.outcome == 'success'
        continue-on-error: true
        env:
          RELEASE_SHOTS: ${{ steps.shots.outputs.names }}
          RELEASE_SHOTS_OUT: ${{ runner.temp }}/release-shots
        run: bun run --filter=@stella/web release:shots

      - name: Upload release screenshots to R2
        id: upload_shots
        if: steps.capture_shots.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MATERIALS_BASE_URL: ${{ vars.VITE_MATERIALS_BASE_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          bun run release:shots upload --product web --version "$VERSION" \
            --dir "$RUNNER_TEMP/release-shots" --out "$RUNNER_TEMP/release/images.json"

      # 新しい版の本文と通知に使う要約を用意する。
      - name: Prepare release notes
        if: steps.release.outputs.exists == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          SCREENSHOT_UPLOAD: ${{ steps.upload_shots.outcome }}
        run: |
          images=()
          if [[ "$SCREENSHOT_UPLOAD" == 'success' && -f "$RUNNER_TEMP/release/images.json" ]]; then
            images=(--images "$RUNNER_TEMP/release/images.json")
          fi
          bun run release:notes prepare --product web --version "$VERSION" \
            --changelog apps/web/CHANGELOG.md --commit "$GITHUB_SHA" --out-dir "$RUNNER_TEMP/release" "${images[@]}"

      # タグは Release の作成と同時に切る。作成に失敗したらタグは残らず、
      # 次のデプロイで作り直せる。
      # 添付した要点は毎朝の release-announce.yml が Google Chat に送る。
      - name: Create Web release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/release/release-summary.json" --target "$GITHUB_SHA" \
            --title "Web 本体 $TAG" --notes-file "$RUNNER_TEMP/release/release-body.md"
